<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreedomMap</title>
<style>
:root{
  --navy:#0b1f3a;--blue:#1463ff;--blue2:#0d4ed8;--bg:#f5f8fc;--text:#202b3c;
  --muted:#667085;--border:#dce4ef;--soft:#eef5ff;--green:#087443;--amber:#a15c00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
body{min-height:100vh}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:900;color:var(--navy);font-size:19px;letter-spacing:-.02em}
.rep-pill{font-size:12px;color:var(--muted);text-align:right}
.progress-copy{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:8px;border-radius:999px;background:#e5ebf3;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s ease}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 12px 35px rgba(15,35,75,.07);padding:24px}
.eyebrow{font-size:13px;font-weight:850;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;color:var(--navy)}
.sub{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 22px}
label.field-label{display:block;font-weight:800;color:var(--navy);margin-bottom:8px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px;font-size:17px;outline:none}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,99,255,.12)}
textarea{min-height:110px;resize:vertical}
.options{display:grid;gap:10px}
.option{width:100%;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:14px;padding:15px 16px;text-align:left;font-weight:750;cursor:pointer;transition:.15s ease}
.option:hover{border-color:#adc5ff;background:#f8fbff}
.option.selected{border-color:var(--blue);background:var(--soft);color:var(--blue2);box-shadow:0 0 0 2px rgba(20,99,255,.08)}
.money,.percent{position:relative}.money span,.percent span{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.money span{left:16px}.money input{padding-left:34px}.percent span{right:16px}.percent input{padding-right:42px}
.actions{display:flex;gap:10px;margin-top:26px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:850;cursor:pointer;min-height:52px}
.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--navy);flex:0 0 auto}
.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.primary:hover{background:var(--blue2)}
.section-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 0}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.section-title{font-weight:900;color:var(--navy)}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#eef5ff;color:var(--blue2)}
.review-row{padding:12px 0;border-top:1px solid var(--border)}.review-row:first-child{border-top:0}
.review-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:3px}.review-value{font-size:15px;color:var(--navy);white-space:pre-wrap}
.action-box{background:#f8fbff;border:1px solid #d8e5ff;border-radius:16px;padding:16px;margin-top:18px}
.action-box h3{margin:0 0 10px;color:var(--navy);font-size:17px}.action-box ul{padding-left:20px;margin:0}.action-box li{margin:7px 0}
.note{font-size:12px;line-height:1.45;color:var(--muted);margin-top:12px}.error{font-size:13px;color:#b42318;font-weight:700;margin-top:8px}
@media(min-width:700px){.app{padding-top:30px}.card{padding:34px}h1{font-size:36px}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand">FreedomMap</div>
    <div class="rep-pill" id="repPill">Rep not set</div>
  </div>

  <div class="progress-copy"><span id="progressText">Question 1</span><span id="progressPercent">0%</span></div>
  <div class="progress"><div id="progressBar"></div></div>

  <section class="card">
    <div id="screen"></div>
    <div class="actions">
      <button class="btn secondary" id="backBtn" type="button">Back</button>
      <button class="btn primary" id="continueBtn" type="button">Continue</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {
    repId:"",
    householdType:"",
    clientName:"",
    partnerName:"",
    sections:[],
    insuranceTypes:[],
    clientLife:"",
    partnerLife:"",
    clientDisability:"",
    partnerDisability:"",
    clientCI:"",
    partnerCI:"",
    healthDental:"",
    travelInsurance:"",
    investmentAccounts:[],
    clientRRSP:"",
    partnerRRSP:"",
    clientTFSA:"",
    partnerTFSA:"",
    clientFHSA:"",
    partnerFHSA:"",
    investmentTotal:"",
    investmentGoal:"",
    contributingRegularly:"",
    ownsHome:"",
    homeValue:"",
    mortgageBalance:"",
    mortgageRate:"",
    mortgageRenewal:"",
    mortgageGoals:[],
    autoHomeTypes:[],
    lastCompared:"",
    openToComparison:"",
    clientWill:"",
    partnerWill:"",
    clientPOA:"",
    partnerPOA:"",
    clientDirective:"",
    partnerDirective:"",
    legalInterest:"",
    otherNotes:""
  };

  const sectionOptions = [
    "Insurance",
    "Investments",
    "Mortgage",
    "Auto & Home",
    "Legal Services"
  ];

  const investmentAccounts = ["RRSP","TFSA","FHSA","RESP","Workplace pension / group plan","Non-registered investments","None / Not sure"];
  const mortgageGoals = ["New purchase","Mortgage renewal","Refinance","Debt consolidation","Lower monthly payments","Access home equity","Buy another property","Not sure"];
  const autoHomeTypes = ["Auto","Home","Tenant","Landlord","Business / liability","Other","None / Not sure"];
  const insuranceTypes = ["Life","Disability","Critical Illness","Health & Dental","Travel","None / Not sure"];

  function isCouple(){ return state.householdType === "Couple"; }
  function wants(section){ return state.sections.includes(section); }

  const Q = [
    {k:"repId", section:"Start", t:"What is your Primerica Rep ID?", s:"This determines where your completed FreedomMap will be emailed.", y:"text", p:"Example: ABC123", r:true},
    {k:"householdType", section:"Start", t:"Who is completing this FreedomMap?", s:"We'll tailor the questions for one person or a couple.", y:"single", o:["Just me","Couple"], r:true, save:v=>v==="Just me"?"Single":"Couple"},
    {k:"clientName", section:"Start", t:()=>isCouple()?"What is the first person's name?":"What's your name?", s:"First and last name.", y:"text", p:"First and last name", r:true},
    {k:"partnerName", section:"Start", t:"What is your spouse or partner's name?", s:"First and last name.", y:"text", p:"First and last name", r:true, v:()=>isCouple()},
    {k:"sections", section:"Start", t:"What would you like help with?", s:"Choose one or more areas. You can select all five.", y:"multi", o:sectionOptions, r:true},

    {k:"insuranceTypes", section:"Insurance", t:"Which types of insurance do you currently have?", s:"Choose all that apply.", y:"multi", o:insuranceTypes, r:true, v:()=>wants("Insurance")},
    {k:"clientLife", section:"Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — do you have life insurance?`:"Do you currently have life insurance?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance") && !state.insuranceTypes.includes("None / Not sure")},
    {k:"partnerLife", section:"Insurance", t:()=>`${state.partnerName || "Partner"} — do you have life insurance?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance") && isCouple() && !state.insuranceTypes.includes("None / Not sure")},
    {k:"clientDisability", section:"Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — do you have disability insurance?`:"Do you have disability insurance?", s:"Personal or through work.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance") && !state.insuranceTypes.includes("None / Not sure")},
    {k:"partnerDisability", section:"Insurance", t:()=>`${state.partnerName || "Partner"} — do you have disability insurance?`, s:"Personal or through work.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance") && isCouple() && !state.insuranceTypes.includes("None / Not sure")},
    {k:"clientCI", section:"Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — do you have critical illness insurance?`:"Do you have critical illness insurance?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance") && !state.insuranceTypes.includes("None / Not sure")},
    {k:"partnerCI", section:"Insurance", t:()=>`${state.partnerName || "Partner"} — do you have critical illness insurance?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance") && isCouple() && !state.insuranceTypes.includes("None / Not sure")},
    {k:"healthDental", section:"Insurance", t:"Do you have health & dental coverage?", s:"This can be through work, personally, or both.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance")},
    {k:"travelInsurance", section:"Insurance", t:"Do you currently have travel insurance?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Insurance")},

    {k:"investmentAccounts", section:"Investments", t:"Which savings or investment accounts do you currently have?", s:"Choose all that apply.", y:"multi", o:investmentAccounts, r:true, v:()=>wants("Investments")},
    {k:"clientRRSP", section:"Investments", t:()=>isCouple()?`${state.clientName || "First person"} — do you have an RRSP?`:"Do you have an RRSP?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && !state.investmentAccounts.includes("None / Not sure")},
    {k:"partnerRRSP", section:"Investments", t:()=>`${state.partnerName || "Partner"} — do you have an RRSP?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && isCouple() && !state.investmentAccounts.includes("None / Not sure")},
    {k:"clientTFSA", section:"Investments", t:()=>isCouple()?`${state.clientName || "First person"} — do you have a TFSA?`:"Do you have a TFSA?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && !state.investmentAccounts.includes("None / Not sure")},
    {k:"partnerTFSA", section:"Investments", t:()=>`${state.partnerName || "Partner"} — do you have a TFSA?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && isCouple() && !state.investmentAccounts.includes("None / Not sure")},
    {k:"clientFHSA", section:"Investments", t:()=>isCouple()?`${state.clientName || "First person"} — do you have an FHSA?`:"Do you have an FHSA?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && !state.investmentAccounts.includes("None / Not sure")},
    {k:"partnerFHSA", section:"Investments", t:()=>`${state.partnerName || "Partner"} — do you have an FHSA?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && isCouple() && !state.investmentAccounts.includes("None / Not sure")},
    {k:"investmentTotal", section:"Investments", t:"Approximately how much do you currently have saved or invested?", s:"An estimate is fine.", y:"money", p:"0", v:()=>wants("Investments")},
    {k:"investmentGoal", section:"Investments", t:"What are you primarily investing for?", s:"Choose the closest answer.", y:"single", o:["Retirement","First home","Children's education","Building wealth","Short-term goals","Not sure"], r:true, v:()=>wants("Investments")},
    {k:"contributingRegularly", section:"Investments", t:"Are you currently contributing regularly?", s:"This includes automatic or recurring contributions.", y:"single", o:["Yes","No","Sometimes"], r:true, v:()=>wants("Investments")},

    {k:"ownsHome", section:"Mortgage", t:"Do you currently own a home?", s:"This determines which mortgage questions apply.", y:"single", o:["Yes","No"], r:true, v:()=>wants("Mortgage")},
    {k:"homeValue", section:"Mortgage", t:"What is the approximate value of your home?", s:"An estimate is fine.", y:"money", p:"0", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageBalance", section:"Mortgage", t:"What is your approximate mortgage balance?", s:"An estimate is fine.", y:"money", p:"0", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageRate", section:"Mortgage", t:"What is your current mortgage interest rate?", s:"Leave blank if you're not sure.", y:"percent", p:"4.99", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageRenewal", section:"Mortgage", t:"When does your mortgage renew?", s:"Leave blank if you're not sure.", y:"date", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageGoals", section:"Mortgage", t:"What would you like to review with a mortgage professional?", s:"Choose as many as apply.", y:"multi", o:mortgageGoals, r:true, v:()=>wants("Mortgage")},

    {k:"autoHomeTypes", section:"Auto & Home", t:"Which types of general insurance do you currently have or need?", s:"Choose all that apply.", y:"multi", o:autoHomeTypes, r:true, v:()=>wants("Auto & Home")},
    {k:"lastCompared", section:"Auto & Home", t:"When did you last compare your auto, home or business insurance?", s:"Choose the closest answer.", y:"single", o:["Within the last year","1–3 years ago","More than 3 years ago","Never","Not sure"], r:true, v:()=>wants("Auto & Home")},
    {k:"openToComparison", section:"Auto & Home", t:"Would you be open to a no-obligation insurance comparison?", s:"This can help your rep identify whether a referral makes sense.", y:"single", o:["Yes","Maybe","No"], r:true, v:()=>wants("Auto & Home")},

    {k:"clientWill", section:"Legal Services", t:()=>isCouple()?`${state.clientName || "First person"} — do you have a current Will?`:"Do you have a current Will?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services")},
    {k:"partnerWill", section:"Legal Services", t:()=>`${state.partnerName || "Partner"} — do you have a current Will?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"clientPOA", section:"Legal Services", t:()=>isCouple()?`${state.clientName || "First person"} — do you have an Enduring Power of Attorney?`:"Do you have an Enduring Power of Attorney?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services")},
    {k:"partnerPOA", section:"Legal Services", t:()=>`${state.partnerName || "Partner"} — do you have an Enduring Power of Attorney?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"clientDirective", section:"Legal Services", t:()=>isCouple()?`${state.clientName || "First person"} — do you have a Personal Directive?`:"Do you have a Personal Directive?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services")},
    {k:"partnerDirective", section:"Legal Services", t:()=>`${state.partnerName || "Partner"} — do you have a Personal Directive?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"legalInterest", section:"Legal Services", t:"Would you like information about ongoing legal services?", s:"This can include access to legal support through the referral program.", y:"single", o:["Yes","Maybe","No"], r:true, v:()=>wants("Legal Services")},

    {k:"otherNotes", section:"Finish", t:"Anything else you'd like your representative to know?", s:"Optional. Add any questions, concerns or priorities we haven't covered.", y:"textarea", p:"Optional notes..."}
  ];

  let index=0, review=false;

  function visible(){ return Q.filter(q=>!q.v || q.v()); }
  function current(){ const list=visible(); if(index>=list.length) index=Math.max(0,list.length-1); return list[index]; }
  function title(q){ return typeof q.t==="function" ? q.t() : q.t; }
  function escape(v){ return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

  function saveEntry(q){
    const e=$("entry");
    if(!e) return;
    let v=e.value.trim();
    if(["money","percent"].includes(q.y)) v=v.replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
    state[q.k]=q.save?q.save(v):v;
  }

  function field(q){
    if(q.y==="text"||q.y==="number") return `<label class="field-label" for="entry">Your answer</label><input id="entry" type="${q.y}" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}">`;
    if(q.y==="money") return `<label class="field-label" for="entry">Amount (CAD)</label><div class="money"><span>$</span><input id="entry" inputmode="decimal" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}"></div>`;
    if(q.y==="percent") return `<label class="field-label" for="entry">Interest rate</label><div class="percent"><input id="entry" inputmode="decimal" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}"><span>%</span></div>`;
    if(q.y==="date") return `<label class="field-label" for="entry">Date</label><input id="entry" type="date" value="${escape(state[q.k])}">`;
    if(q.y==="textarea") return `<label class="field-label" for="entry">Optional details</label><textarea id="entry" placeholder="${escape(q.p||"")}">${escape(state[q.k])}</textarea>`;
    const multi=q.y==="multi";
    return `<div class="options">${q.o.map(o=>{
      const sel=multi?state[q.k].includes(o):state[q.k]===o;
      return `<button type="button" class="option ${sel?"selected":""}" data-option="${escape(o)}">${escape(o)}</button>`;
    }).join("")}</div>`;
  }

  function render(){
    review=false;
    const list=visible(), q=current(), pct=Math.round(index/list.length*100);
    $("repPill").textContent=state.repId?state.repId+"@primerica.com":"Rep not set";
    $("progressText").textContent=`Question ${index+1} of ${list.length}`;
    $("progressPercent").textContent=pct+"%";
    $("progressBar").style.width=pct+"%";
    $("backBtn").style.visibility=index===0?"hidden":"visible";
    $("continueBtn").textContent=index===list.length-1?"Review My FreedomMap":"Continue";
    $("screen").innerHTML=`<div class="eyebrow">${escape(q.section)}</div><h1>${escape(title(q))}</h1><p class="sub">${escape(q.s||"")}</p>${field(q)}<div id="errorBox"></div>`;
    document.querySelectorAll("[data-option]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.dataset.option;
        if(q.y==="multi"){
          if(val==="None / Not sure"){
            state[q.k]=state[q.k].includes(val)?[]:[val];
          } else {
            state[q.k]=state[q.k].filter(x=>x!=="None / Not sure");
            state[q.k]=state[q.k].includes(val)?state[q.k].filter(x=>x!==val):state[q.k].concat(val);
          }
        } else {
          state[q.k]=q.save?q.save(val):val;
        }
        render();
      };
    });
  }

  function validate(){
    const q=current(), v=state[q.k];
    if(q.r && (Array.isArray(v)?v.length===0:!v)){
      $("errorBox").innerHTML='<div class="error">Please answer this question to continue.</div>';
      return false;
    }
    if(q.k==="repId" && v && !/^[A-Z0-9._-]+$/.test(v)){
      $("errorBox").innerHTML='<div class="error">Please enter a valid Rep ID using letters and numbers.</div>';
      return false;
    }
    return true;
  }

  function money(v){
    if(!v) return "Not provided";
    const n=Number(v);
    return Number.isFinite(n)?n.toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:0}):v;
  }
  function date(v){
    if(!v) return "Not provided";
    const p=v.split("-");
    return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;
  }
  function D(k){
    const v=state[k];
    if(Array.isArray(v)) return v.length?v.join(", "):"Not provided";
    if(["investmentTotal","homeValue","mortgageBalance"].includes(k)) return money(v);
    if(k==="mortgageRate") return v?v+"%":"Not provided";
    if(k==="mortgageRenewal") return date(v);
    return v||"Not provided";
  }

  function sectionStatus(name){
    return wants(name) ? "Selected" : "Not selected";
  }

  function actionItems(){
    const a=[];
    if(wants("Insurance")){
      if([state.clientLife,state.clientDisability,state.clientCI,state.partnerLife,state.partnerDisability,state.partnerCI].some(x=>x==="No"||x==="Not sure") || state.healthDental!=="Yes" || state.travelInsurance!=="Yes")
        a.push("Insurance — review current protection and any coverage gaps or uncertainties");
      else a.push("Insurance — review current protection");
    }
    if(wants("Investments")) a.push("Investments — review current accounts, contribution strategy and stated investment goal");
    if(wants("Mortgage")) a.push("Mortgage referral — review selected mortgage needs: "+D("mortgageGoals"));
    if(wants("Auto & Home") && state.openToComparison!=="No") a.push("Auto & Home referral — client is open to an insurance comparison");
    if(wants("Legal Services")){
      const legal=[state.clientWill,state.clientPOA,state.clientDirective,state.partnerWill,state.partnerPOA,state.partnerDirective].filter(Boolean);
      if(legal.some(x=>x!=="Yes")) a.push("Legal Services referral — review Will, POA and Personal Directive needs");
      else a.push("Legal Services referral — review current legal document/service needs");
    }
    if(state.otherNotes) a.push("Review additional client notes");
    return a;
  }

  function peopleSummary(section){
    if(section==="Insurance"){
      let rows=[
        ["Coverage types selected",D("insuranceTypes")],
        [state.clientName||"Client",`Life: ${D("clientLife")} | Disability: ${D("clientDisability")} | Critical Illness: ${D("clientCI")}`]
      ];
      if(isCouple()) rows.push([state.partnerName||"Partner",`Life: ${D("partnerLife")} | Disability: ${D("partnerDisability")} | Critical Illness: ${D("partnerCI")}`]);
      rows.push(["Health & Dental",D("healthDental")],["Travel",D("travelInsurance")]);
      return rows;
    }
    if(section==="Investments"){
      let rows=[
        ["Accounts selected",D("investmentAccounts")],
        [state.clientName||"Client",`RRSP: ${D("clientRRSP")} | TFSA: ${D("clientTFSA")} | FHSA: ${D("clientFHSA")}`]
      ];
      if(isCouple()) rows.push([state.partnerName||"Partner",`RRSP: ${D("partnerRRSP")} | TFSA: ${D("partnerTFSA")} | FHSA: ${D("partnerFHSA")}`]);
      rows.push(["Approx. invested",D("investmentTotal")],["Primary goal",D("investmentGoal")],["Contributing regularly",D("contributingRegularly")]);
      return rows;
    }
    if(section==="Mortgage"){
      return [["Homeowner",D("ownsHome")],["Approx. home value",D("homeValue")],["Mortgage balance",D("mortgageBalance")],["Mortgage rate",D("mortgageRate")],["Renewal",D("mortgageRenewal")],["Review interests",D("mortgageGoals")]];
    }
    if(section==="Auto & Home"){
      return [["Coverage / needs",D("autoHomeTypes")],["Last compared",D("lastCompared")],["Open to comparison",D("openToComparison")]];
    }
    if(section==="Legal Services"){
      let rows=[[state.clientName||"Client",`Will: ${D("clientWill")} | POA: ${D("clientPOA")} | Personal Directive: ${D("clientDirective")}`]];
      if(isCouple()) rows.push([state.partnerName||"Partner",`Will: ${D("partnerWill")} | POA: ${D("partnerPOA")} | Personal Directive: ${D("partnerDirective")}`]);
      rows.push(["Ongoing legal services",D("legalInterest")]);
      return rows;
    }
    return [];
  }

  function renderReview(){
    review=true;
    $("progressText").textContent="Review";
    $("progressPercent").textContent="100%";
    $("progressBar").style.width="100%";
    $("backBtn").style.visibility="visible";
    $("continueBtn").textContent="Email My FreedomMap to My Rep";

    const household=isCouple()?`${state.clientName} & ${state.partnerName}`:state.clientName;
    const cards=sectionOptions.map(sec=>{
      const selected=wants(sec);
      return `<div class="section-card"><div class="section-head"><div class="section-title">${escape(sec)}</div><div class="badge">${selected?"Selected":"Not selected"}</div></div>`+
        (selected?peopleSummary(sec).map(([l,v])=>`<div class="review-row"><div class="review-label">${escape(l)}</div><div class="review-value">${escape(v)}</div></div>`).join(""):`<div class="note">No review requested in this section.</div>`) +
      `</div>`;
    }).join("");

    $("screen").innerHTML=`
      <div class="eyebrow">Your FreedomMap</div>
      <h1>${escape(household)}</h1>
      <p class="sub">Review your answers before opening your email app. Nothing is sent automatically.</p>
      ${cards}
      <div class="action-box"><h3>Potential items to review</h3><ul>${actionItems().map(x=>`<li>${escape(x)}</li>`).join("")}</ul></div>
      <div class="review-row"><div class="review-label">Additional notes</div><div class="review-value">${escape(D("otherNotes"))}</div></div>
      <div class="note">FreedomMap organizes client-provided information for review. It does not make financial, insurance, mortgage, legal or investment recommendations.</div>
    `;
  }

  function emailBody(){
    const lines=[
      "FREEDOMMAP — CLIENT INTAKE",
      "",
      `Household: ${isCouple()?state.clientName+" & "+state.partnerName:state.clientName}`,
      `Household type: ${state.householdType}`,
      `Primerica Rep ID: ${state.repId}`,
      `Areas selected: ${state.sections.join(", ")}`,
      ""
    ];
    sectionOptions.forEach(sec=>{
      lines.push(sec.toUpperCase());
      if(!wants(sec)){ lines.push("• Not selected",""); return; }
      peopleSummary(sec).forEach(([l,v])=>lines.push(`• ${l}: ${v}`));
      lines.push("");
    });
    lines.push("POTENTIAL ITEMS TO REVIEW");
    actionItems().forEach(x=>lines.push(`• ${x}`));
    lines.push("","ADDITIONAL NOTES",state.otherNotes||"None provided");
    lines.push("","FreedomMap organizes client-provided information for review with a licensed representative or referral partner. It does not provide automatic recommendations.");
    return lines.join("\n");
  }

  function sendEmail(){
    const to=`${state.repId}@primerica.com`;
    const subject=`FreedomMap — ${isCouple()?state.clientName+" & "+state.partnerName:state.clientName}`;
    location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody())}`;
  }

  $("continueBtn").onclick=()=>{
    if(review){ sendEmail(); return; }
    const q=current();
    saveEntry(q);
    if(q.k==="repId") state.repId=state.repId.toUpperCase();
    if(!validate()) return;
    const list=visible();
    if(index<list.length-1){ index++; render(); } else renderReview();
  };

  $("backBtn").onclick=()=>{
    if(review){ review=false; index=visible().length-1; render(); return; }
    saveEntry(current());
    if(index>0){ index--; render(); }
  };

  render();
})();
</script>
</body>
</html>
