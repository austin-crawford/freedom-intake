<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FreedomMap</title>
<style>
:root{
  --navy:#0b1f3a;--blue:#1463ff;--blue2:#0d4ed8;--bg:#f5f8fc;--text:#202b3c;
  --muted:#667085;--border:#dce4ef;--soft:#eef5ff;--green:#087443;--amber:#a15c00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
body{min-height:100vh}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:900;color:var(--navy);font-size:19px;letter-spacing:-.02em}
.progress-copy{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:8px;border-radius:999px;background:#e5ebf3;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s ease}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 12px 35px rgba(15,35,75,.07);padding:24px}
.eyebrow{font-size:13px;font-weight:850;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;color:var(--navy)}
.sub{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 22px}
label.field-label{display:block;font-weight:800;color:var(--navy);margin-bottom:8px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px;font-size:17px;outline:none}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,99,255,.12)}
textarea{min-height:110px;resize:vertical}
.options{display:grid;gap:10px}
.option{width:100%;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:14px;padding:15px 16px;text-align:left;font-weight:750;cursor:pointer;transition:.15s ease}
.option:hover{border-color:#adc5ff;background:#f8fbff}
.option.selected{border-color:var(--blue);background:var(--soft);color:var(--blue2);box-shadow:0 0 0 2px rgba(20,99,255,.08)}
.option-title{display:block;font-weight:850;color:inherit}.option-desc{display:block;margin-top:4px;font-size:13px;line-height:1.35;font-weight:600;color:var(--muted)}.option-note{display:block;margin-top:5px;font-size:12px;line-height:1.3;font-weight:750;color:var(--blue2)}
.rank-option{display:flex;align-items:center;gap:12px}.rank-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e8eef8;color:var(--navy);font-weight:900;flex:0 0 auto}.rank-option.selected .rank-num{background:var(--blue);color:#fff}.rank-reset{margin-top:12px;font-size:13px;color:var(--blue2);background:none;border:0;padding:0;font-weight:800;cursor:pointer}
.money,.percent{position:relative}.money span,.percent span{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.money span{left:16px}.money input{padding-left:34px}.percent span{right:16px}.percent input{padding-right:42px}
.actions{display:flex;gap:10px;margin-top:26px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:850;cursor:pointer;min-height:52px}
.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--navy);flex:0 0 auto}
.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.primary:hover{background:var(--blue2)}
.section-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 0}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.section-title{font-weight:900;color:var(--navy)}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#eef5ff;color:var(--blue2)}
.review-row{padding:12px 0;border-top:1px solid var(--border)}.review-row:first-child{border-top:0}
.review-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:3px}.review-value{font-size:15px;color:var(--navy);white-space:pre-wrap}
.summary-group{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.summary-group:first-of-type{margin-top:0;border-top:0;padding-top:0}
.summary-subhead{font-size:13px;font-weight:900;color:var(--navy);margin-bottom:9px}
.summary-grid{display:grid;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.summary-line{display:grid;grid-template-columns:minmax(125px,1fr) minmax(150px,1.35fr);gap:12px;padding:10px 12px;border-top:1px solid var(--border);align-items:start}
.summary-line:first-child{border-top:0}
.summary-key{font-size:12px;font-weight:850;color:var(--muted)}
.summary-val{font-size:14px;font-weight:700;color:var(--navy)}
.summary-val.attention{font-weight:900;color:#9a3412}
.account-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:9px}
.account-card:first-child{margin-top:0}
.account-name{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:9px}
.account-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.account-stat{background:#f8fbff;border-radius:10px;padding:10px}
.account-stat-label{font-size:11px;font-weight:850;color:var(--muted);margin-bottom:3px}
.account-stat-value{font-size:14px;font-weight:850;color:var(--navy)}
.summary-tags{display:flex;flex-wrap:wrap;gap:7px}
.summary-tag{border:1px solid var(--border);background:#f8fbff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:750;color:var(--navy)}
@media(max-width:520px){.summary-line{grid-template-columns:1fr}.account-stats{grid-template-columns:1fr}}
.action-box{background:#f8fbff;border:1px solid #d8e5ff;border-radius:16px;padding:16px;margin-top:18px}
.action-box h3{margin:0 0 10px;color:var(--navy);font-size:17px}.action-box ul{padding-left:20px;margin:0}.action-box li{margin:7px 0}
.note{font-size:12px;line-height:1.45;color:var(--muted);margin-top:12px}.error{font-size:13px;color:#b42318;font-weight:700;margin-top:8px}
@media(min-width:700px){.app{padding-top:30px}.card{padding:34px}h1{font-size:36px}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.topbar,.progress-copy,.progress,.actions{display:none!important}.card{border:0;box-shadow:none;padding:0}.section-card{break-inside:avoid}h1{font-size:28px}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand">FreedomMap</div>
  </div>

  <div class="progress-copy"><span id="progressText">Question 1</span><span id="progressPercent">0%</span></div>
  <div class="progress"><div id="progressBar"></div></div>

  <section class="card">
    <div id="screen"></div>
    <div class="actions">
      <button class="btn secondary" id="backBtn" type="button">Back</button>
      <button class="btn secondary" id="productsBtn" type="button">Products</button>
      <button class="btn primary" id="continueBtn" type="button">Continue</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {
    householdType:"",
    clientName:"",
    partnerName:"",
    sections:[],
    rankedAreas:[],
    exploreMore:"",

    clientLife:"",
    partnerLife:"",
    clientDisability:"",
    partnerDisability:"",
    clientCI:"",
    partnerCI:"",
    clientHealthDental:"",
    partnerHealthDental:"",
    clientTravel:"",
    partnerTravel:"",
    insuranceFit:"",
    insuranceOpen:"",

    investmentAccounts:[],
    investmentDetails:{},
    investmentGoals:[],
    retirementTargetKnowledge:"",
    taxOptimizationKnowledge:"",
    retirementDurationKnowledge:"",
    investmentOpen:"",

    housingSituation:"",
    homeValueRange:"",
    mortgageBalanceRange:"",
    mortgageRateRange:"",
    mortgageRenewalRange:"",
    hasNonMortgageDebt:"",
    debtTypes:[],
    debtRange:"",
    mortgageOpen:"",

    generalInsuranceNeeds:[],
    lastCompared:"",
    openToComparison:"",

    clientLegalDocuments:[],
    partnerLegalDocuments:[],
    legalInterest:"",

    otherNotes:""
  };

  const sectionOptions = [
    "Investments",
    "Personal Insurance",
    "Mortgage & Debt Elimination",
    "General Insurance",
    "Legal Services"
  ];

  const sectionMeta = {
    "Personal Insurance": {
      title: "Personal Insurance",
      desc: "Life, Disability, Critical Illness, Health & Dental, Travel",
      note: "Access to multiple personal insurance carriers"
    },
    "Investments": {
      title: "Investments",
      desc: "Retirement, Home Downpayment, Education & Wealth Building",
      note: "Access to RRSPs, TFSAs, FHSAs, RESPs & multiple investment firms"
    },
    "Mortgage & Debt Elimination": {
      title: "Mortgage & Debt Elimination",
      desc: "Purchase, Renewal, Refinance, Debt Consolidation & Debt Elimination",
      note: "Access to 65+ lenders"
    },
    "General Insurance": {
      title: "General Insurance",
      desc: "Auto, Home, Tenant, Landlord & Business Insurance",
      note: "Access to 10+ general insurance companies"
    },
    "Legal Services": {
      title: "Legal Services",
      desc: "Wills, Powers of Attorney, Personal Directives & Ongoing Legal Advice",
      note: "Membership access to lawyers for legal guidance"
    }
  };

  const investmentAccountsSingle = ["RRSP","TFSA","FHSA","RESP","Workplace pension / group plan","Non-registered investments","None","Not sure"];
  const investmentAccountsCouple = () => [
    (state.clientName || "Person 1") + " RRSP",
    (state.partnerName || "Person 2") + " RRSP",
    (state.clientName || "Person 1") + " TFSA",
    (state.partnerName || "Person 2") + " TFSA",
    (state.clientName || "Person 1") + " FHSA",
    (state.partnerName || "Person 2") + " FHSA",
    "RESP",
    "Workplace pension / group plan",
    "Non-registered investments",
    "None",
    "Not sure"
  ];
  const investmentGoals = ["Retirement","Home downpayment","Children's education","Building wealth","Emergency / short-term savings","Other","Not sure"];

  const housingSituations = ["Own with a mortgage","Own mortgage-free","Renting","Living with family / other","Planning to buy","Not sure"];
  const mortgageRenewalRanges = ["Within 6 months","6–12 months","1–2 years","More than 2 years","Not sure"];
  const debtTypes = ["Credit cards","Line of credit","Vehicle loan","Personal loan","Student loan","CRA / tax debt","Other"];

  const generalInsuranceOptions = ["Auto","Home","Tenant","Landlord","Business / liability","Other","I’m not sure — review my needs"];
  const legalDocumentOptions = ["Will","Enduring Power of Attorney","Personal Directive","None","Not sure"];

  const coverageSourceOptions = ["Individual policy","Group coverage through work","Both individual and group coverage","None","Not sure"];
  const fitOptions = ["Yes","Mostly","Not sure","No"];
  const opennessOptions = ["Yes","Maybe","No"];

  function isCouple(){ return state.householdType === "Couple"; }
  function wants(section){ return state.sections.includes(section); }
  function rankableAreas(){
    const all=["Investments","Personal Insurance","Mortgage & Debt Elimination","General Insurance","Legal Services"];
    return all.filter(x=>state.sections.includes(x));
  }
  function remainingAreas(){
    return ["Investments","Personal Insurance","Mortgage & Debt Elimination","General Insurance","Legal Services","No, I'm done"];
  }
  function questionSectionForArea(area){ return area; }
  function selectedInvestmentAccounts(){
    return state.investmentAccounts.filter(x=>!["None","Not sure"].includes(x));
  }

  const Q = [
    {k:"householdType", section:"Start", t:"Who is completing this FreedomMap?", s:"We'll tailor the questions for one person or a couple.", y:"single", o:["Just me","Couple"], r:true},
    {k:"clientName", section:"Start", t:()=>isCouple()?"What is the first person's name?":"What's your name?", s:"First and last name.", y:"text", p:"First and last name", r:true},
    {k:"partnerName", section:"Start", t:"What is your spouse or partner's name?", s:"First and last name.", y:"text", p:"First and last name", r:true, v:()=>isCouple()},
    {k:"sections", section:"Start", t:"What would you like to review?", s:"Choose an area to start with.", y:"multi", o:sectionOptions, r:true},

    {k:"investmentAccounts", section:"Investments", t:"Which savings or investment accounts do you currently have?", s:"Choose all that apply.", y:"multi", o:investmentAccountsSingle, r:true, v:()=>wants("Investments") && !isCouple()},
    {k:"investmentAccounts", section:"Investments", t:"Which savings or investment accounts do you currently have?", s:"Choose all that apply.", y:"multi", o:investmentAccountsCouple, r:true, v:()=>wants("Investments") && isCouple()},
    {k:"investmentDetails", section:"Investments", t:"Enter the details for your investment accounts", s:"For each account, enter the current balance and current monthly contribution.", y:"investmentDetails", r:true, v:()=>wants("Investments") && selectedInvestmentAccounts().length>0},
    {k:"investmentGoals", section:"Investments", t:"What are you currently saving or investing for?", s:"Choose all that apply.", y:"multi", o:investmentGoals, r:true, v:()=>wants("Investments")},
    {k:"retirementTargetKnowledge", section:"Investments", t:"Do you know how much you need to have saved to reach your retirement goal?", s:"Choose the closest answer.", y:"single", o:["Yes","I have an estimate","No","Not sure"], r:true, v:()=>wants("Investments")},
    {k:"taxOptimizationKnowledge", section:"Investments", t:"Do you know whether you're using the most tax-efficient accounts and contribution strategy for your situation?", s:"Choose the closest answer.", y:"single", o:["Yes","Somewhat","No","Not sure"], r:true, v:()=>wants("Investments")},
    {k:"retirementDurationKnowledge", section:"Investments", t:"Do you know how long your retirement savings are expected to last?", s:"Choose the closest answer.", y:"single", o:["Yes","I have an estimate","No","Not sure"], r:true, v:()=>wants("Investments")},
    {k:"investmentOpen", section:"Investments", t:"If an improvement is identified, would you be open to reviewing other investment options?", s:"Choose the closest answer.", y:"single", o:opennessOptions, r:true, v:()=>wants("Investments")},

    {k:"clientLife", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your life insurance come from?`:"Where does your life insurance come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"partnerLife", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your life insurance come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple()},
    {k:"clientDisability", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your disability coverage come from?`:"Where does your disability coverage come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"partnerDisability", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your disability coverage come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple()},
    {k:"clientCI", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your critical illness coverage come from?`:"Where does your critical illness coverage come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"partnerCI", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your critical illness coverage come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple()},
    {k:"clientHealthDental", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your health & dental coverage come from?`:"Where does your health & dental coverage come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"partnerHealthDental", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your health & dental coverage come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple()},
    {k:"clientTravel", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your travel insurance come from?`:"Where does your travel insurance come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"partnerTravel", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your travel insurance come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple()},
    {k:"insuranceFit", section:"Personal Insurance", t:"Do you feel your current personal insurance meets your needs?", s:"Choose the closest answer.", y:"single", o:fitOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"insuranceOpen", section:"Personal Insurance", t:"If an improvement or gap is identified, would you be open to reviewing options?", s:"Choose the closest answer.", y:"single", o:opennessOptions, r:true, v:()=>wants("Personal Insurance")},

    {k:"housingSituation", section:"Mortgage & Debt Elimination", t:"What best describes your current housing situation?", s:"Choose the closest answer.", y:"single", o:housingSituations, r:true, v:()=>wants("Mortgage & Debt Elimination")},
    {k:"homeValueRange", section:"Mortgage & Debt Elimination", t:"What is the estimated current value of your home?", s:"Enter the amount in Canadian dollars.", y:"money", p:"0", r:true, v:()=>wants("Mortgage & Debt Elimination") && ["Own with a mortgage","Own mortgage-free"].includes(state.housingSituation)},
    {k:"mortgageBalanceRange", section:"Mortgage & Debt Elimination", t:"What is your current mortgage balance?", s:"Enter the amount in Canadian dollars.", y:"money", p:"0", r:true, v:()=>wants("Mortgage & Debt Elimination") && state.housingSituation==="Own with a mortgage"},
    {k:"mortgageRateRange", section:"Mortgage & Debt Elimination", t:"What is your current mortgage interest rate?", s:"Enter the current rate.", y:"percent", p:"0.00", r:true, v:()=>wants("Mortgage & Debt Elimination") && state.housingSituation==="Own with a mortgage"},
    {k:"mortgageRenewalRange", section:"Mortgage & Debt Elimination", t:"When is your mortgage coming up for renewal?", s:"Choose the closest answer.", y:"single", o:mortgageRenewalRanges, r:true, v:()=>wants("Mortgage & Debt Elimination") && state.housingSituation==="Own with a mortgage"},
    {k:"hasNonMortgageDebt", section:"Mortgage & Debt Elimination", t:"Do you currently have any non-mortgage debt?", s:"This can include credit cards, lines of credit, vehicle loans, personal loans, student loans or tax debt.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Mortgage & Debt Elimination")},
    {k:"debtTypes", section:"Mortgage & Debt Elimination", t:"What types of non-mortgage debt do you currently have?", s:"Choose all that apply.", y:"multi", o:debtTypes, r:true, v:()=>wants("Mortgage & Debt Elimination") && state.hasNonMortgageDebt==="Yes"},
    {k:"debtRange", section:"Mortgage & Debt Elimination", t:"What is the total balance of your non-mortgage debt?", s:"Enter the current total in Canadian dollars.", y:"money", p:"0", r:true, v:()=>wants("Mortgage & Debt Elimination") && state.hasNonMortgageDebt==="Yes"},
    {k:"mortgageOpen", section:"Mortgage & Debt Elimination", t:()=>["Own with a mortgage","Planning to buy"].includes(state.housingSituation)?"Would you be open to reviewing mortgage and debt elimination options?":"Would you be open to reviewing debt elimination options?", s:"Choose the closest answer.", y:"single", o:opennessOptions, r:true, v:()=>wants("Mortgage & Debt Elimination")},

    {k:"generalInsuranceNeeds", section:"General Insurance", t:"Which areas of general insurance would you like us to review?", s:"Select any policies you currently have or may need.", y:"multi", o:generalInsuranceOptions, r:true, v:()=>wants("General Insurance")},
    {k:"lastCompared", section:"General Insurance", t:"When did you last compare your coverage or pricing?", s:"Choose the closest answer.", y:"single", o:["Within the last year","1–3 years ago","More than 3 years ago","Never","Not sure"], r:true, v:()=>wants("General Insurance")},
    {k:"openToComparison", section:"General Insurance", t:"If an improvement is identified, would you be open to a no-obligation comparison?", s:"Choose the closest answer.", y:"single", o:opennessOptions, r:true, v:()=>wants("General Insurance")},

    {k:"clientLegalDocuments", section:"Legal Services", t:()=>isCouple()?`Which legal documents does ${state.clientName || "the first person"} currently have in place?`:"Which legal documents do you currently have in place?", s:"Choose all that apply.", y:"multi", o:legalDocumentOptions, r:true, v:()=>wants("Legal Services")},
    {k:"partnerLegalDocuments", section:"Legal Services", t:()=>`Which legal documents does ${state.partnerName || "your partner"} currently have in place?`, s:"Choose all that apply.", y:"multi", o:legalDocumentOptions, r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"legalInterest", section:"Legal Services", t:"If we can help you get missing documents in place or provide access to legal support, would you be open to learning more?", s:"Choose the closest answer.", y:"single", o:opennessOptions, r:true, v:()=>wants("Legal Services")},

    {k:"exploreMore", section:"Finish", t:"Would you like to explore another area?", s:"You can add another area before finishing your FreedomMap.", y:"single", o:remainingAreas, r:true, v:()=>rankableAreas().length>0},
    {k:"otherNotes", section:"Finish", t:"Anything else you'd like your representative to know?", s:"Optional. Add anything else you'd like your representative to know.", y:"textarea", p:"Optional notes...", v:()=>rankableAreas().length>0},
    {k:"rankedAreas", section:"Finish", t:"Rank your selected areas in order of importance to you", s:"Tap each area from most important to least important.", y:"rank", o:rankableAreas, r:true, v:()=>rankableAreas().length>0}
  ];

  let index=0, review=false, exploreReturnArea="", navHistory=[];

  function visible(){ return Q.filter(q=>!q.v || q.v()); }
  function current(){ const list=visible(); if(index>=list.length) index=Math.max(0,list.length-1); return list[index]; }
  function rememberCurrent(){
    if(review) return;
    const q=current();
    if(!q) return;
    if(navHistory[navHistory.length-1]!==q) navHistory.push(q);
  }
  function returnToHistory(){
    const list=visible();
    const here=current();
    while(navHistory.length){
      const target=navHistory.pop();
      const targetIndex=list.indexOf(target);
      if(targetIndex>=0 && target!==here){
        index=targetIndex;
        render();
        return true;
      }
    }
    return false;
  }
  function title(q){ return typeof q.t==="function" ? q.t() : q.t; }
  function escape(v){ return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

  function saveEntry(q){
    if(q.y==="investmentDetails"){
      document.querySelectorAll("[data-invest-account]").forEach(el=>{
        const account=el.dataset.investAccount;
        const type=el.dataset.investField;
        const raw=el.value.trim().replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
        if(!state.investmentDetails[account]) state.investmentDetails[account]={balance:"",contribution:""};
        state.investmentDetails[account][type]=raw;
      });
      return;
    }
    const e=$("entry");
    if(!e) return;
    let v=e.value.trim();
    if(["money","percent"].includes(q.y)) v=v.replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
    state[q.k]=q.save?q.save(v):v;
  }

  function field(q){
    if(q.k==="sections" || q.k==="exploreMore"){
      const options=typeof q.o==="function" ? q.o() : q.o;
      return '<div class="options">'+options.map(o=>{
        const sel=state[q.k].includes(o);
        const m=sectionMeta[o]||{title:o,desc:o==="No, I'm done"?"Continue to finish your FreedomMap":""};
        return '<button type="button" class="option '+(sel?"selected":"")+'" data-option="'+escape(o)+'"><span class="option-title">'+escape(m.title)+'</span>'+(m.desc?'<span class="option-desc">'+escape(m.desc)+'</span>':'')+(m.note?'<span class="option-note">'+escape(m.note)+'</span>':'')+'</button>';
      }).join("")+'</div>';
    }
    if(q.y==="investmentDetails"){
      return '<div class="options">'+selectedInvestmentAccounts().map(account=>{
        const d=state.investmentDetails[account]||{balance:"",contribution:""};
        return '<div class="section-card" style="margin:0"><div class="section-title" style="margin-bottom:14px">'+escape(account)+'</div>'+
          '<label class="field-label">Current balance</label><div class="money"><span>$</span><input data-invest-account="'+escape(account)+'" data-invest-field="balance" inputmode="decimal" value="'+escape(d.balance)+'" placeholder="0"></div>'+
          '<label class="field-label" style="margin-top:14px">Current monthly contribution</label><div class="money"><span>$</span><input data-invest-account="'+escape(account)+'" data-invest-field="contribution" inputmode="decimal" value="'+escape(d.contribution)+'" placeholder="0"></div></div>';
      }).join("")+'</div>';
    }
    if(q.y==="rank"){
      const options=typeof q.o==="function" ? q.o() : q.o;
      state.rankedAreas=state.rankedAreas.filter(x=>options.includes(x));
      return '<div class="options">'+options.map(o=>{
        const pos=state.rankedAreas.indexOf(o);
        return '<button type="button" class="option rank-option '+(pos>=0?"selected":"")+'" data-rank="'+escape(o)+'"><span class="rank-num">'+(pos>=0?(pos+1):"")+'</span><span>'+escape(o)+'</span></button>';
      }).join("")+'</div>'+(state.rankedAreas.length?'<button type="button" class="rank-reset" id="rankReset">Reset ranking</button>':'');
    }
    if(q.y==="text"||q.y==="number") return `<label class="field-label" for="entry">Your answer</label><input id="entry" type="${q.y}" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}">`;
    if(q.y==="money") return `<label class="field-label" for="entry">Amount (CAD)</label><div class="money"><span>$</span><input id="entry" inputmode="decimal" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}"></div>`;
    if(q.y==="percent") return `<label class="field-label" for="entry">Interest rate</label><div class="percent"><input id="entry" inputmode="decimal" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}"><span>%</span></div>`;
    if(q.y==="date") return `<label class="field-label" for="entry">Date</label><input id="entry" type="date" value="${escape(state[q.k])}">`;
    if(q.y==="textarea") return `<label class="field-label" for="entry">Optional details</label><textarea id="entry" placeholder="${escape(q.p||"")}">${escape(state[q.k])}</textarea>`;
    const multi=q.y==="multi";
    const options=typeof q.o==="function" ? q.o() : q.o;
    return `<div class="options">${options.map(o=>{
      const sel=multi?state[q.k].includes(o):(q.k==="householdType" ? (o==="Just me" ? (state[q.k]==="Just me" || state[q.k]==="Single") : state[q.k]===o) : state[q.k]===o);
      return `<button type="button" class="option ${sel?"selected":""}" data-option="${escape(o)}">${escape(o)}</button>`;
    }).join("")}</div>`;
  }

  function render(){
    review=false;
    const list=visible(), q=current(), pct=Math.round(index/list.length*100);
    $("progressText").textContent=`Question ${index+1} of ${list.length}`;
    $("progressPercent").textContent=pct+"%";
    $("progressBar").style.width=pct+"%";
    $("backBtn").style.visibility=index===0?"hidden":"visible";
    $("productsBtn").style.display=q.section==="Start"?"none":"block";
    $("continueBtn").style.display=(q.k==="sections" || q.k==="exploreMore")?"none":"block";
    $("continueBtn").textContent=index===list.length-1?"Review My FreedomMap":"Continue";
    $("screen").innerHTML=`<div class="eyebrow">${escape(q.section)}</div><h1>${escape(title(q))}</h1><p class="sub">${escape(q.s||"")}</p>${field(q)}<div id="errorBox"></div>`;
    document.querySelectorAll("[data-rank]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.dataset.rank;
        if(state.rankedAreas.includes(val)){
          state.rankedAreas=state.rankedAreas.filter(x=>x!==val);
        } else if(state.rankedAreas.length<rankableAreas().length){
          state.rankedAreas=state.rankedAreas.concat(val);
        }
        render();
      };
    });
    const rankReset=$("rankReset");
    if(rankReset) rankReset.onclick=()=>{ state.rankedAreas=[]; render(); };

    document.querySelectorAll("[data-option]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.dataset.option;

        if(q.k==="sections"){
          rememberCurrent();
          if(!state.sections.includes(val)) state.sections.push(val);
          state.rankedAreas=state.rankedAreas.filter(x=>rankableAreas().includes(x));
          const list=visible();
          const targetIndex=list.findIndex(item=>item.section===questionSectionForArea(val));
          if(targetIndex>=0){ rememberCurrent(); index=targetIndex; render(); return; }
        }

        if(q.k==="exploreMore"){
          rememberCurrent();
          if(val==="No, I'm done"){
            state.exploreMore=val;
            const list=visible();
            const targetIndex=list.findIndex(item=>item.k==="otherNotes");
            if(targetIndex>=0){ index=targetIndex; render(); return; }
          } else {
            if(!state.sections.includes(val)) state.sections.push(val);
            state.exploreMore="";
            state.rankedAreas=state.rankedAreas.filter(x=>rankableAreas().includes(x));
            exploreReturnArea=val;
            const list=visible();
            const targetIndex=list.findIndex(item=>item.section===questionSectionForArea(val));
            if(targetIndex>=0){ index=targetIndex; render(); return; }
          }
        }

        if(q.y==="multi"){
          const exclusive=["None / Not sure","None","Not sure","I’m not sure — review my needs"];
          if(exclusive.includes(val)){
            state[q.k]=state[q.k].includes(val)?[]:[val];
          } else {
            state[q.k]=state[q.k].filter(x=>!exclusive.includes(x));
            state[q.k]=state[q.k].includes(val)?state[q.k].filter(x=>x!==val):state[q.k].concat(val);
          }
        } else {
          if(q.k==="householdType"){
            state[q.k]=val;
          } else {
            state[q.k]=q.save?q.save(val):val;
          }
        }
        render();
      };
    });
  }

  function validate(){
    const q=current(), v=state[q.k];
    if(q.y==="rank" && v.length!==rankableAreas().length){ $("errorBox").innerHTML='<div class="error">Please rank all selected areas to continue.</div>'; return false; }
    if(q.y==="investmentDetails"){
      const missing=selectedInvestmentAccounts().some(account=>{
        const d=state.investmentDetails[account]||{};
        return d.balance==="" || d.contribution==="";
      });
      if(missing){ $("errorBox").innerHTML='<div class="error">Please enter both the current balance and monthly contribution for each account.</div>'; return false; }
    }
    if(q.r && (Array.isArray(v)?v.length===0:!v)){
      $("errorBox").innerHTML='<div class="error">Please answer this question to continue.</div>';
      return false;
    }
    return true;
  }

  function D(k){
    const v=state[k];
    if(Array.isArray(v)) return v.length?v.join(", "):"Not provided";
    return v||"Not provided";
  }

  function moneyD(k){ const v=Number(state[k]); return state[k]!=="" && Number.isFinite(v) ? v.toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided"; }
  function percentD(k){ return state[k]!=="" ? state[k]+"%" : "Not provided"; }

  function sectionStatus(name){
    return wants(name) ? "Selected" : "Not selected";
  }

  function peopleSummary(section){
    if(section==="Personal Insurance"){
      let rows=[
        [state.clientName||"Client",`Life: ${D("clientLife")} | Disability: ${D("clientDisability")} | Critical Illness: ${D("clientCI")} | Health & Dental: ${D("clientHealthDental")} | Travel: ${D("clientTravel")}`]
      ];
      if(isCouple()) rows.push([state.partnerName||"Partner",`Life: ${D("partnerLife")} | Disability: ${D("partnerDisability")} | Critical Illness: ${D("partnerCI")} | Health & Dental: ${D("partnerHealthDental")} | Travel: ${D("partnerTravel")}`]);
      rows.push(["Does current coverage meet needs?",D("insuranceFit")],["Open to reviewing options",D("insuranceOpen")]);
      return rows;
    }
    if(section==="Investments"){
      const rows=[["Current accounts",D("investmentAccounts")]];
      selectedInvestmentAccounts().forEach(account=>{
        const d=state.investmentDetails[account]||{};
        const balance=d.balance!==undefined && d.balance!=="" ? Number(d.balance).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided";
        const contribution=d.contribution!==undefined && d.contribution!=="" ? Number(d.contribution).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "Not provided";
        rows.push([account, "Balance: "+balance+" | Contribution: "+contribution]);
      });
      rows.push(
        ["Saving / investing for",D("investmentGoals")],
        ["Knows retirement savings target",D("retirementTargetKnowledge")],
        ["Knows whether strategy is tax-efficient",D("taxOptimizationKnowledge")],
        ["Knows how long retirement savings may last",D("retirementDurationKnowledge")],
        ["Open to reviewing other options",D("investmentOpen")]
      );
      return rows;
    }
    if(section==="Mortgage & Debt Elimination"){
      const rows=[
        ["Housing situation",D("housingSituation")]
      ];
      if(["Own with a mortgage","Own mortgage-free"].includes(state.housingSituation)){
        rows.push(["Home value",moneyD("homeValueRange")]);
      }
      if(state.housingSituation==="Own with a mortgage"){
        rows.push(["Mortgage balance",moneyD("mortgageBalanceRange")],["Mortgage interest rate",percentD("mortgageRateRange")],["Renewal timing",D("mortgageRenewalRange")]);
      }
      rows.push(["Non-mortgage debt",D("hasNonMortgageDebt")]);
      if(state.hasNonMortgageDebt==="Yes"){
        rows.push(["Debt types",D("debtTypes")],["Total non-mortgage debt",moneyD("debtRange")]);
      }
      rows.push([["Own with a mortgage","Planning to buy"].includes(state.housingSituation)?"Open to reviewing mortgage & debt elimination options":"Open to reviewing debt elimination options",D("mortgageOpen")]);
      return rows;
    }
    if(section==="General Insurance"){
      return [
        ["Insurance to review / set up",D("generalInsuranceNeeds")],
        ["Last compared coverage or pricing",D("lastCompared")],
        ["Open to no-obligation comparison",D("openToComparison")]
      ];
    }
    if(section==="Legal Services"){
      const rows=[[state.clientName||"Client",D("clientLegalDocuments")]];
      if(isCouple()) rows.push([state.partnerName||"Partner",D("partnerLegalDocuments")]);
      rows.push(["Open to learning more",D("legalInterest")]);
      return rows;
    }
    return [];
  }

  function attentionClass(v){
    return ["None","Not sure","No","Not provided"].includes(v) ? " attention" : "";
  }

  function renderInsuranceSummary(){
    const types=[
      ["Life Insurance","clientLife","partnerLife"],
      ["Disability Insurance","clientDisability","partnerDisability"],
      ["Critical Illness Insurance","clientCI","partnerCI"],
      ["Health & Dental","clientHealthDental","partnerHealthDental"],
      ["Travel Insurance","clientTravel","partnerTravel"]
    ];
    const personBlock=(name,isPartner)=>'<div class="summary-group"><div class="summary-subhead">'+escape(name)+'</div><div class="summary-grid">'+
      types.map(([label,clientKey,partnerKey])=>{
        const value=D(isPartner?partnerKey:clientKey);
        return '<div class="summary-line"><div class="summary-key">'+escape(label)+'</div><div class="summary-val'+attentionClass(value)+'">'+escape(value)+'</div></div>';
      }).join("")+'</div></div>';

    let html=personBlock(state.clientName||"Client",false);
    if(isCouple()) html+=personBlock(state.partnerName||"Partner",true);
    html+='<div class="summary-group"><div class="summary-grid">'+
      '<div class="summary-line"><div class="summary-key">Current coverage meets needs?</div><div class="summary-val'+attentionClass(D("insuranceFit"))+'">'+escape(D("insuranceFit"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">Open to reviewing options?</div><div class="summary-val'+attentionClass(D("insuranceOpen"))+'">'+escape(D("insuranceOpen"))+'</div></div>'+
      '</div></div>';
    return html;
  }

  function renderInvestmentSummary(){
    let html='<div class="summary-group"><div class="summary-subhead">Current Accounts</div>';
    if(selectedInvestmentAccounts().length){
      html+=selectedInvestmentAccounts().map(account=>{
        const d=state.investmentDetails[account]||{};
        const balance=d.balance!==undefined && d.balance!=="" ? Number(d.balance).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided";
        const contribution=d.contribution!==undefined && d.contribution!=="" ? Number(d.contribution).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "Not provided";
        return '<div class="account-card"><div class="account-name">'+escape(account)+'</div><div class="account-stats">'+
          '<div class="account-stat"><div class="account-stat-label">Current balance</div><div class="account-stat-value">'+escape(balance)+'</div></div>'+
          '<div class="account-stat"><div class="account-stat-label">Monthly contribution</div><div class="account-stat-value">'+escape(contribution)+'</div></div>'+
          '</div></div>';
      }).join("");
    } else {
      html+='<div class="summary-val'+attentionClass(D("investmentAccounts"))+'">'+escape(D("investmentAccounts"))+'</div>';
    }
    html+='</div>';

    html+='<div class="summary-group"><div class="summary-subhead">Saving / Investing For</div><div class="summary-tags">'+
      (state.investmentGoals.length?state.investmentGoals.map(x=>'<span class="summary-tag">'+escape(x)+'</span>').join(""):'<span class="summary-val attention">Not provided</span>')+
      '</div></div>';

    html+='<div class="summary-group"><div class="summary-subhead">Planning Knowledge</div><div class="summary-grid">'+
      '<div class="summary-line"><div class="summary-key">Retirement savings target</div><div class="summary-val'+attentionClass(D("retirementTargetKnowledge"))+'">'+escape(D("retirementTargetKnowledge"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">Tax optimization strategy</div><div class="summary-val'+attentionClass(D("taxOptimizationKnowledge"))+'">'+escape(D("taxOptimizationKnowledge"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">How long retirement savings may last</div><div class="summary-val'+attentionClass(D("retirementDurationKnowledge"))+'">'+escape(D("retirementDurationKnowledge"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">Open to reviewing other options?</div><div class="summary-val'+attentionClass(D("investmentOpen"))+'">'+escape(D("investmentOpen"))+'</div></div>'+
      '</div></div>';
    return html;
  }

  function renderSectionSummary(section){
    if(section==="Personal Insurance") return renderInsuranceSummary();
    if(section==="Investments") return renderInvestmentSummary();
    return peopleSummary(section).map(([l,v])=>'<div class="review-row"><div class="review-label">'+escape(l)+'</div><div class="review-value">'+escape(v)+'</div></div>').join("");
  }

  function renderReview(){
    review=true;
    $("progressText").textContent="Review";
    $("progressPercent").textContent="100%";
    $("progressBar").style.width="100%";
    $("backBtn").style.visibility="visible";
    $("productsBtn").style.display="block";
    $("continueBtn").style.display="block";
    $("continueBtn").textContent="Save / Print FreedomMap PDF";

    const household=isCouple()?`${state.clientName} & ${state.partnerName}`:state.clientName;
    const cards=sectionOptions.map(sec=>{
      const selected=wants(sec);
      return `<div class="section-card"><div class="section-head"><div class="section-title">${escape(sec)}</div><div class="badge">${selected?"Selected":"Not selected"}</div></div>`+
        (selected?renderSectionSummary(sec):`<div class="note">No review requested in this section.</div>`) +
      `</div>`;
    }).join("");

    $("screen").innerHTML=`
      <div class="eyebrow">Your FreedomMap</div>
      <h1>${escape(household)}</h1>
      <p class="sub">Review the completed FreedomMap, then save or print it as a PDF for your records.</p>
      <div class="section-card"><div class="section-head"><div class="section-title">Your Priorities</div><div class="badge">Ranked</div></div><div class="review-row"><div class="review-label">Selected areas ranked by importance</div><div class="review-value">${escape(state.rankedAreas.map((x,i)=>(i+1)+". "+x).join("\n"))}</div></div></div>
      ${cards}
      <div class="review-row"><div class="review-label">Additional notes</div><div class="review-value">${escape(D("otherNotes"))}</div></div>
    `;
  }

  function savePdf(){ window.print(); }

  $("continueBtn").onclick=()=>{
    if(review){ savePdf(); return; }
    const q=current();
    saveEntry(q);
    if(!validate()) return;

    if(q.k==="exploreMore"){
      if(state.exploreMore!=="No, I'm done"){
        const area=state.exploreMore;
        if(!state.sections.includes(area)) state.sections.push(area);
        state.exploreMore="";
        state.rankedAreas=state.rankedAreas.filter(x=>rankableAreas().includes(x));
        exploreReturnArea=area;
        const list=visible();
        const targetSection=questionSectionForArea(area);
        const targetIndex=list.findIndex(item=>item.section===targetSection);
        if(targetIndex>=0){ index=targetIndex; render(); return; }
      }
    }

    if(exploreReturnArea){
      const list=visible();
      const targetSection=questionSectionForArea(exploreReturnArea);
      const sectionIndexes=list.map((item,i)=>item.section===targetSection?i:-1).filter(i=>i>=0);
      const lastSectionIndex=sectionIndexes.length?Math.max(...sectionIndexes):-1;
      if(index===lastSectionIndex){
        exploreReturnArea="";
        state.exploreMore="";
        const refreshed=visible();
        const exploreIndex=refreshed.findIndex(item=>item.k==="exploreMore");
        if(exploreIndex>=0){ rememberCurrent(); index=exploreIndex; render(); return; }
      }
    }

    const list=visible();
    if(index<list.length-1){
      rememberCurrent();
      index++;
      render();
    } else {
      rememberCurrent();
      renderReview();
    }
  };

  $("productsBtn").onclick=()=>{
    if(!review) saveEntry(current());
    rememberCurrent();
    review=false;
    exploreReturnArea="";
    state.exploreMore="";
    const list=visible();
    const menuIndex=list.findIndex(item=>item.k==="exploreMore");
    if(menuIndex>=0){ index=menuIndex; render(); }
  };

  $("backBtn").onclick=()=>{
    if(review){
      review=false;
      exploreReturnArea="";
      if(returnToHistory()) return;
      index=Math.max(0,visible().length-1);
      render();
      return;
    }
    saveEntry(current());
    exploreReturnArea="";
    if(returnToHistory()) return;
    if(index>0){ index--; render(); }
  };

  render();
})();
</script>
</body>
</html>
