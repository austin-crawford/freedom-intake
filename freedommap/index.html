<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreedomMap</title>
<style>
:root{
  --navy:#0b1f3a;--blue:#1463ff;--blue2:#0d4ed8;--bg:#f5f8fc;--text:#202b3c;
  --muted:#667085;--border:#dce4ef;--soft:#eef5ff;--green:#087443;--amber:#a15c00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
body{min-height:100vh}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:900;color:var(--navy);font-size:19px;letter-spacing:-.02em}
.rep-pill{font-size:12px;color:var(--muted);text-align:right}
.progress-copy{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:8px;border-radius:999px;background:#e5ebf3;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s ease}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 12px 35px rgba(15,35,75,.07);padding:24px}
.eyebrow{font-size:13px;font-weight:850;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;color:var(--navy)}
.sub{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 22px}
label.field-label{display:block;font-weight:800;color:var(--navy);margin-bottom:8px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px;font-size:17px;outline:none}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,99,255,.12)}
textarea{min-height:110px;resize:vertical}
.options{display:grid;gap:10px}
.option{width:100%;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:14px;padding:15px 16px;text-align:left;font-weight:750;cursor:pointer;transition:.15s ease}
.option:hover{border-color:#adc5ff;background:#f8fbff}
.option.selected{border-color:var(--blue);background:var(--soft);color:var(--blue2);box-shadow:0 0 0 2px rgba(20,99,255,.08)}
.option-title{display:block;font-weight:850;color:inherit}.option-desc{display:block;margin-top:4px;font-size:13px;line-height:1.35;font-weight:600;color:var(--muted)}.option-note{display:block;margin-top:5px;font-size:12px;line-height:1.3;font-weight:750;color:var(--blue2)}
.money,.percent{position:relative}.money span,.percent span{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.money span{left:16px}.money input{padding-left:34px}.percent span{right:16px}.percent input{padding-right:42px}
.actions{display:flex;gap:10px;margin-top:26px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:850;cursor:pointer;min-height:52px}
.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--navy);flex:0 0 auto}
.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.primary:hover{background:var(--blue2)}
.section-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 0}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.section-title{font-weight:900;color:var(--navy)}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#eef5ff;color:var(--blue2)}
.review-row{padding:12px 0;border-top:1px solid var(--border)}.review-row:first-child{border-top:0}
.review-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:3px}.review-value{font-size:15px;color:var(--navy);white-space:pre-wrap}
.action-box{background:#f8fbff;border:1px solid #d8e5ff;border-radius:16px;padding:16px;margin-top:18px}
.action-box h3{margin:0 0 10px;color:var(--navy);font-size:17px}.action-box ul{padding-left:20px;margin:0}.action-box li{margin:7px 0}
.note{font-size:12px;line-height:1.45;color:var(--muted);margin-top:12px}.error{font-size:13px;color:#b42318;font-weight:700;margin-top:8px}
@media(min-width:700px){.app{padding-top:30px}.card{padding:34px}h1{font-size:36px}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand">FreedomMap</div>
    <div class="rep-pill" id="repPill">Rep not set</div>
  </div>

  <div class="progress-copy"><span id="progressText">Question 1</span><span id="progressPercent">0%</span></div>
  <div class="progress"><div id="progressBar"></div></div>

  <section class="card">
    <div id="screen"></div>
    <div class="actions">
      <button class="btn secondary" id="backBtn" type="button">Back</button>
      <button class="btn primary" id="continueBtn" type="button">Continue</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {
    repId:"",
    householdType:"",
    clientName:"",
    partnerName:"",
    sections:[],
    priorities:[],
    insuranceTypes:[],
    clientLife:"",
    partnerLife:"",
    clientDisability:"",
    partnerDisability:"",
    clientCI:"",
    partnerCI:"",
    clientHealthDental:"",
    partnerHealthDental:"",
    clientTravel:"",
    partnerTravel:"",
    insuranceFit:"",
    insuranceOpen:"",
    investmentAccounts:[],
    clientRRSP:"",
    partnerRRSP:"",
    clientTFSA:"",
    partnerTFSA:"",
    clientFHSA:"",
    partnerFHSA:"",
    investmentTotal:"",
    investmentGoal:"",
    contributingRegularly:"",
    investmentFit:"",
    investmentOpen:"",
    ownsHome:"",
    homeValue:"",
    mortgageBalance:"",
    mortgageRate:"",
    mortgageRenewal:"",
    mortgageGoals:[],
    mortgageFit:"",
    mortgageOpen:"",
    autoHomeTypes:[],
    generalInsuranceNeeds:[],
    lastCompared:"",
    generalInsuranceFit:"",
    openToComparison:"",
    clientWill:"",
    partnerWill:"",
    clientPOA:"",
    partnerPOA:"",
    clientDirective:"",
    partnerDirective:"",
    legalFit:"",
    legalInterest:"",
    otherNotes:""
  };

  const sectionOptions = [
    "Personal Insurance",
    "Investments",
    "Mortgage",
    "General Insurance",
    "Legal Services",
    "Review Everything"
  ];

  const sectionMeta = {
    "Personal Insurance": {
      title: "Personal Insurance",
      desc: "Life, Disability, Critical Illness, Health & Dental, Travel",
      note: "Access to multiple personal insurance carriers"
    },
    "Investments": {
      title: "Investments",
      desc: "Retirement, Home Downpayment, Education & Wealth Building",
      note: "Access to RRSPs, TFSAs, FHSAs, RESPs & multiple investment firms"
    },
    "Mortgage": {
      title: "Mortgage",
      desc: "Purchase, Renewal, Refinance & Debt Consolidation",
      note: "Access to 65+ lenders"
    },
    "General Insurance": {
      title: "General Insurance",
      desc: "Auto, Home, Tenant, Landlord & Business Insurance",
      note: "Access to 10+ general insurance companies"
    },
    "Legal Services": {
      title: "Legal Services",
      desc: "Wills, Powers of Attorney, Personal Directives & Ongoing Legal Advice",
      note: "Membership access to lawyers for legal guidance"
    },
    "Review Everything": {
      title: "Not Sure — Review Everything",
      desc: "Help me identify which areas may be worth discussing",
      note: "Review all five areas"
    }
  };

  const priorityOptions = ["Protecting my family and income","Retirement planning","Saving for a home / downpayment","Reducing debt or mortgage costs","Growing my savings and investments","Saving for children education","Improving auto, home or business insurance","Getting legal documents and advice in place","Not sure — help me prioritize"];

  const investmentAccounts = ["RRSP","TFSA","FHSA","RESP","Workplace pension / group plan","Non-registered investments","None / Not sure"];
  const mortgageGoals = ["New purchase","Mortgage renewal","Refinance","Debt consolidation","Lower monthly payments","Access home equity","Buy another property","Not sure"];
  const autoHomeTypes = ["Auto","Home","Tenant","Landlord","Business / liability","Other","None / Not sure"];
  const insuranceTypes = ["Life","Disability","Critical Illness","Health & Dental","Travel","None / Not sure"];
  const coverageSourceOptions = ["Individual policy","Group coverage through work","Both individual and group coverage","None","Not sure"];
  const fitOptions = ["Yes — it meets my needs","Mostly","Not sure","No — I think there may be gaps"];
  const opennessOptions = ["Yes","Maybe","No"];

  function isCouple(){ return state.householdType === "Couple"; }
  function wants(section){ return state.sections.includes(section) || state.sections.includes("Review Everything"); }

  const Q = [
    {k:"repId", section:"Start", t:"What is your Primerica Rep ID?", s:"This determines where your completed FreedomMap will be emailed.", y:"text", p:"Example: ABC123", r:true},
    {k:"householdType", section:"Start", t:"Who is completing this FreedomMap?", s:"We'll tailor the questions for one person or a couple.", y:"single", o:["Just me","Couple"], r:true, save:v=>v==="Just me"?"Single":"Couple"},
    {k:"clientName", section:"Start", t:()=>isCouple()?"What is the first person's name?":"What's your name?", s:"First and last name.", y:"text", p:"First and last name", r:true},
    {k:"partnerName", section:"Start", t:"What is your spouse or partner's name?", s:"First and last name.", y:"text", p:"First and last name", r:true, v:()=>isCouple()},
    {k:"sections", section:"Start", t:"What would you like to review?", s:"Select any areas you have questions or concerns about.", y:"multi", o:sectionOptions, r:true},
    {k:"priorities", section:"Start", t:"What is most important to you right now?", s:"Choose the priorities you want your representative to focus on first.", y:"multi", o:priorityOptions, r:true},

    {k:"insuranceTypes", section:"Personal Insurance", t:"Which types of personal insurance do you currently have?", s:"Choose all that apply. We’ll use the next questions to identify whether coverage is individual, through work, both, or not currently in place.", y:"multi", o:insuranceTypes, r:true, v:()=>wants("Personal Insurance")},
    {k:"clientLife", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your life insurance come from?`:"Where does your life insurance come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && state.insuranceTypes.includes("Life")},
    {k:"partnerLife", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your life insurance come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple() && state.insuranceTypes.includes("Life")},
    {k:"clientDisability", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your disability coverage come from?`:"Where does your disability coverage come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && state.insuranceTypes.includes("Disability")},
    {k:"partnerDisability", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your disability coverage come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple() && state.insuranceTypes.includes("Disability")},
    {k:"clientCI", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your critical illness coverage come from?`:"Where does your critical illness coverage come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && state.insuranceTypes.includes("Critical Illness")},
    {k:"partnerCI", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your critical illness coverage come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple() && state.insuranceTypes.includes("Critical Illness")},
    {k:"clientHealthDental", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your health & dental coverage come from?`:"Where does your health & dental coverage come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && state.insuranceTypes.includes("Health & Dental")},
    {k:"partnerHealthDental", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your health & dental coverage come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple() && state.insuranceTypes.includes("Health & Dental")},
    {k:"clientTravel", section:"Personal Insurance", t:()=>isCouple()?`${state.clientName || "First person"} — where does your travel insurance come from?`:"Where does your travel insurance come from?", s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && state.insuranceTypes.includes("Travel")},
    {k:"partnerTravel", section:"Personal Insurance", t:()=>`${state.partnerName || "Partner"} — where does your travel insurance come from?`, s:"Choose the closest answer.", y:"single", o:coverageSourceOptions, r:true, v:()=>wants("Personal Insurance") && isCouple() && state.insuranceTypes.includes("Travel")},
    {k:"insuranceFit", section:"Personal Insurance", t:"Do you feel your current personal insurance meets your needs?", s:"This helps your representative distinguish between coverage you are comfortable with and areas you may want reviewed.", y:"single", o:fitOptions, r:true, v:()=>wants("Personal Insurance")},
    {k:"insuranceOpen", section:"Personal Insurance", t:"If an improvement or gap is identified, would you be open to reviewing options?", s:"This does not commit you to making a change.", y:"single", o:opennessOptions, r:true, v:()=>wants("Personal Insurance")},

    {k:"investmentAccounts", section:"Investments", t:"Which savings or investment accounts do you currently have?", s:"Choose all that apply.", y:"multi", o:investmentAccounts, r:true, v:()=>wants("Investments")},
    {k:"clientRRSP", section:"Investments", t:()=>isCouple()?`${state.clientName || "First person"} — do you have an RRSP?`:"Do you have an RRSP?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && !state.investmentAccounts.includes("None / Not sure")},
    {k:"partnerRRSP", section:"Investments", t:()=>`${state.partnerName || "Partner"} — do you have an RRSP?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && isCouple() && !state.investmentAccounts.includes("None / Not sure")},
    {k:"clientTFSA", section:"Investments", t:()=>isCouple()?`${state.clientName || "First person"} — do you have a TFSA?`:"Do you have a TFSA?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && !state.investmentAccounts.includes("None / Not sure")},
    {k:"partnerTFSA", section:"Investments", t:()=>`${state.partnerName || "Partner"} — do you have a TFSA?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && isCouple() && !state.investmentAccounts.includes("None / Not sure")},
    {k:"clientFHSA", section:"Investments", t:()=>isCouple()?`${state.clientName || "First person"} — do you have an FHSA?`:"Do you have an FHSA?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && !state.investmentAccounts.includes("None / Not sure")},
    {k:"partnerFHSA", section:"Investments", t:()=>`${state.partnerName || "Partner"} — do you have an FHSA?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Investments") && isCouple() && !state.investmentAccounts.includes("None / Not sure")},
    {k:"investmentTotal", section:"Investments", t:"Approximately how much do you currently have saved or invested?", s:"An estimate is fine.", y:"money", p:"0", v:()=>wants("Investments")},
    {k:"investmentGoal", section:"Investments", t:"What are you primarily investing for?", s:"Choose the closest answer.", y:"single", o:["Retirement","First home","Children's education","Building wealth","Short-term goals","Not sure"], r:true, v:()=>wants("Investments")},
    {k:"contributingRegularly", section:"Investments", t:"Are you currently contributing regularly?", s:"This includes automatic or recurring contributions.", y:"single", o:["Yes","No","Sometimes"], r:true, v:()=>wants("Investments")},
    {k:"investmentFit", section:"Investments", t:"Do you feel your current savings and investment strategy is on track for your goals?", s:"Think about retirement, a home downpayment, education or wealth building.", y:"single", o:fitOptions, r:true, v:()=>wants("Investments")},
    {k:"investmentOpen", section:"Investments", t:"If an improvement is identified, would you be open to reviewing investment options?", s:"This does not commit you to making a change.", y:"single", o:opennessOptions, r:true, v:()=>wants("Investments")},

    {k:"ownsHome", section:"Mortgage", t:"Do you currently own a home?", s:"This determines which mortgage questions apply.", y:"single", o:["Yes","No"], r:true, v:()=>wants("Mortgage")},
    {k:"homeValue", section:"Mortgage", t:"What is the approximate value of your home?", s:"An estimate is fine.", y:"money", p:"0", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageBalance", section:"Mortgage", t:"What is your approximate mortgage balance?", s:"An estimate is fine.", y:"money", p:"0", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageRate", section:"Mortgage", t:"What is your current mortgage interest rate?", s:"Leave blank if you're not sure.", y:"percent", p:"4.99", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageRenewal", section:"Mortgage", t:"When does your mortgage renew?", s:"Leave blank if you're not sure.", y:"date", v:()=>wants("Mortgage") && state.ownsHome==="Yes"},
    {k:"mortgageGoals", section:"Mortgage", t:"What would you like to review with a mortgage professional?", s:"Choose as many as apply.", y:"multi", o:mortgageGoals, r:true, v:()=>wants("Mortgage")},
    {k:"mortgageFit", section:"Mortgage", t:"Does your current mortgage or financing situation meet your needs?", s:"If you do not currently have a mortgage, answer based on your current home financing plan.", y:"single", o:fitOptions, r:true, v:()=>wants("Mortgage")},
    {k:"mortgageOpen", section:"Mortgage", t:"If a better financing option is identified, would you be open to a mortgage referral?", s:"A referral lets you explore options with a mortgage professional.", y:"single", o:opennessOptions, r:true, v:()=>wants("Mortgage")},

    {k:"autoHomeTypes", section:"General Insurance", t:"Which types of general insurance do you currently have?", s:"Choose all that apply.", y:"multi", o:autoHomeTypes, r:true, v:()=>wants("General Insurance")},
    {k:"generalInsuranceNeeds", section:"General Insurance", t:"Which types of general insurance do you currently need or want reviewed?", s:"Choose all that apply. This helps identify coverage you may need but do not currently have.", y:"multi", o:autoHomeTypes, r:true, v:()=>wants("General Insurance")},
    {k:"lastCompared", section:"General Insurance", t:"When did you last compare your auto, home or business insurance?", s:"Choose the closest answer.", y:"single", o:["Within the last year","1–3 years ago","More than 3 years ago","Never","Not sure"], r:true, v:()=>wants("General Insurance")},
    {k:"generalInsuranceFit", section:"General Insurance", t:"Do you feel your current general insurance coverage and pricing meet your needs?", s:"Think about both the protection you have and what you are paying.", y:"single", o:fitOptions, r:true, v:()=>wants("General Insurance")},
    {k:"openToComparison", section:"General Insurance", t:"If an improvement is identified, would you be open to a no-obligation insurance comparison?", s:"This can help your rep identify whether a referral makes sense.", y:"single", o:opennessOptions, r:true, v:()=>wants("General Insurance")},

    {k:"clientWill", section:"Legal Services", t:()=>isCouple()?`${state.clientName || "First person"} — do you have a current Will?`:"Do you have a current Will?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services")},
    {k:"partnerWill", section:"Legal Services", t:()=>`${state.partnerName || "Partner"} — do you have a current Will?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"clientPOA", section:"Legal Services", t:()=>isCouple()?`${state.clientName || "First person"} — do you have an Enduring Power of Attorney?`:"Do you have an Enduring Power of Attorney?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services")},
    {k:"partnerPOA", section:"Legal Services", t:()=>`${state.partnerName || "Partner"} — do you have an Enduring Power of Attorney?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"clientDirective", section:"Legal Services", t:()=>isCouple()?`${state.clientName || "First person"} — do you have a Personal Directive?`:"Do you have a Personal Directive?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services")},
    {k:"partnerDirective", section:"Legal Services", t:()=>`${state.partnerName || "Partner"} — do you have a Personal Directive?`, s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true, v:()=>wants("Legal Services") && isCouple()},
    {k:"legalFit", section:"Legal Services", t:"Do your current legal documents and access to legal advice meet your needs?", s:"Think about your Will, Powers of Attorney, Personal Directive and whether you have a lawyer you can turn to for advice.", y:"single", o:fitOptions, r:true, v:()=>wants("Legal Services")},
    {k:"legalInterest", section:"Legal Services", t:"If a gap or improvement is identified, would you be open to learning about the legal services membership?", s:"The membership provides access to lawyers for legal guidance and eligible legal services.", y:"single", o:opennessOptions, r:true, v:()=>wants("Legal Services")},

    {k:"otherNotes", section:"Finish", t:"Anything else you'd like your representative to know?", s:"Optional. Add any questions, concerns or priorities we haven't covered.", y:"textarea", p:"Optional notes..."}
  ];

  let index=0, review=false;

  function visible(){ return Q.filter(q=>!q.v || q.v()); }
  function current(){ const list=visible(); if(index>=list.length) index=Math.max(0,list.length-1); return list[index]; }
  function title(q){ return typeof q.t==="function" ? q.t() : q.t; }
  function escape(v){ return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

  function saveEntry(q){
    const e=$("entry");
    if(!e) return;
    let v=e.value.trim();
    if(["money","percent"].includes(q.y)) v=v.replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
    state[q.k]=q.save?q.save(v):v;
  }

  function field(q){
    if(q.k==="sections"){
      return '<div class="options">'+q.o.map(o=>{
        const sel=state[q.k].includes(o);
        const m=sectionMeta[o]||{title:o,desc:""};
        return '<button type="button" class="option '+(sel?"selected":"")+'" data-option="'+escape(o)+'"><span class="option-title">'+escape(m.title)+'</span><span class="option-desc">'+escape(m.desc||"")+'</span>'+(m.note?'<span class="option-note">'+escape(m.note)+'</span>':'')+'</button>';
      }).join("")+'</div>';
    }
    if(q.y==="text"||q.y==="number") return `<label class="field-label" for="entry">Your answer</label><input id="entry" type="${q.y}" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}">`;
    if(q.y==="money") return `<label class="field-label" for="entry">Amount (CAD)</label><div class="money"><span>$</span><input id="entry" inputmode="decimal" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}"></div>`;
    if(q.y==="percent") return `<label class="field-label" for="entry">Interest rate</label><div class="percent"><input id="entry" inputmode="decimal" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}"><span>%</span></div>`;
    if(q.y==="date") return `<label class="field-label" for="entry">Date</label><input id="entry" type="date" value="${escape(state[q.k])}">`;
    if(q.y==="textarea") return `<label class="field-label" for="entry">Optional details</label><textarea id="entry" placeholder="${escape(q.p||"")}">${escape(state[q.k])}</textarea>`;
    const multi=q.y==="multi";
    return `<div class="options">${q.o.map(o=>{
      const sel=multi?state[q.k].includes(o):state[q.k]===o;
      return `<button type="button" class="option ${sel?"selected":""}" data-option="${escape(o)}">${escape(o)}</button>`;
    }).join("")}</div>`;
  }

  function render(){
    review=false;
    const list=visible(), q=current(), pct=Math.round(index/list.length*100);
    $("repPill").textContent=state.repId?state.repId+"@primerica.com":"Rep not set";
    $("progressText").textContent=`Question ${index+1} of ${list.length}`;
    $("progressPercent").textContent=pct+"%";
    $("progressBar").style.width=pct+"%";
    $("backBtn").style.visibility=index===0?"hidden":"visible";
    $("continueBtn").textContent=index===list.length-1?"Review My FreedomMap":"Continue";
    $("screen").innerHTML=`<div class="eyebrow">${escape(q.section)}</div><h1>${escape(title(q))}</h1><p class="sub">${escape(q.s||"")}</p>${field(q)}<div id="errorBox"></div>`;
    document.querySelectorAll("[data-option]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.dataset.option;
        if(q.y==="multi"){
          if(val==="None / Not sure"){
            state[q.k]=state[q.k].includes(val)?[]:[val];
          } else {
            state[q.k]=state[q.k].filter(x=>x!=="None / Not sure");
            state[q.k]=state[q.k].includes(val)?state[q.k].filter(x=>x!==val):state[q.k].concat(val);
          }
        } else {
          state[q.k]=q.save?q.save(val):val;
        }
        render();
      };
    });
  }

  function validate(){
    const q=current(), v=state[q.k];
    if(q.r && (Array.isArray(v)?v.length===0:!v)){
      $("errorBox").innerHTML='<div class="error">Please answer this question to continue.</div>';
      return false;
    }
    if(q.k==="repId" && v && !/^[A-Z0-9._-]+$/.test(v)){
      $("errorBox").innerHTML='<div class="error">Please enter a valid Rep ID using letters and numbers.</div>';
      return false;
    }
    return true;
  }

  function money(v){
    if(!v) return "Not provided";
    const n=Number(v);
    return Number.isFinite(n)?n.toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:0}):v;
  }
  function date(v){
    if(!v) return "Not provided";
    const p=v.split("-");
    return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;
  }
  function D(k){
    const v=state[k];
    if(Array.isArray(v)) return v.length?v.join(", "):"Not provided";
    if(["investmentTotal","homeValue","mortgageBalance"].includes(k)) return money(v);
    if(k==="mortgageRate") return v?v+"%":"Not provided";
    if(k==="mortgageRenewal") return date(v);
    return v||"Not provided";
  }

  function sectionStatus(name){
    return wants(name) ? "Selected" : "Not selected";
  }

  function insuranceMissingTypes(){
    if(state.insuranceTypes.includes("None / Not sure")) return ["Life","Disability","Critical Illness","Health & Dental","Travel"];
    return ["Life","Disability","Critical Illness","Health & Dental","Travel"].filter(x=>!state.insuranceTypes.includes(x));
  }

  function lifeGroupOnlyIssues(){
    const issues=[];
    if(state.insuranceTypes.includes("Life")){
      if(state.clientLife==="Group coverage through work") issues.push((state.clientName||"Client")+" has group-only life insurance");
      if(isCouple() && state.partnerLife==="Group coverage through work") issues.push((state.partnerName||"Partner")+" has group-only life insurance");
      if(state.clientLife==="None" || state.clientLife==="Not sure") issues.push((state.clientName||"Client")+" has no confirmed life insurance");
      if(isCouple() && (state.partnerLife==="None" || state.partnerLife==="Not sure")) issues.push((state.partnerName||"Partner")+" has no confirmed life insurance");
    }
    return issues;
  }

  function actionItems(){
    const a=[];
    if(wants("Personal Insurance")){
      const missing=insuranceMissingTypes();
      if(missing.length) a.push("Personal Insurance — not currently identified: "+missing.join(", "));
      lifeGroupOnlyIssues().forEach(x=>a.push("Personal Insurance — "+x));
      if(state.insuranceFit!=="Yes — it meets my needs") a.push("Personal Insurance — current coverage may need review ("+D("insuranceFit")+")");
      a.push("Personal Insurance — open to reviewing improvements: "+D("insuranceOpen"));
    }
    if(wants("Investments")){
      if(state.investmentAccounts.includes("None / Not sure")) a.push("Investments — no current accounts clearly identified");
      if(state.contributingRegularly!=="Yes") a.push("Investments — regular contributions are not currently confirmed");
      if(state.investmentFit!=="Yes — it meets my needs") a.push("Investments — current strategy may need review ("+D("investmentFit")+")");
      a.push("Investments — open to reviewing improvements: "+D("investmentOpen"));
    }
    if(wants("Mortgage")){
      a.push("Mortgage referral — review interests: "+D("mortgageGoals"));
      if(state.mortgageFit!=="Yes — it meets my needs") a.push("Mortgage — current financing may need review ("+D("mortgageFit")+")");
      a.push("Mortgage — open to referral if an improvement is identified: "+D("mortgageOpen"));
    }
    if(wants("General Insurance")){
      const current=state.autoHomeTypes.filter(x=>x!=="None / Not sure");
      const needed=state.generalInsuranceNeeds.filter(x=>x!=="None / Not sure");
      const missingNeeded=needed.filter(x=>!current.includes(x));
      if(missingNeeded.length) a.push("General Insurance — needed but not currently identified: "+missingNeeded.join(", "));
      if(state.generalInsuranceFit!=="Yes — it meets my needs") a.push("General Insurance — current coverage/pricing may need review ("+D("generalInsuranceFit")+")");
      a.push("General Insurance — open to comparison: "+D("openToComparison"));
    }
    if(wants("Legal Services")){
      const missing=[];
      if(state.clientWill!=="Yes") missing.push((state.clientName||"Client")+" Will");
      if(state.clientPOA!=="Yes") missing.push((state.clientName||"Client")+" Power of Attorney");
      if(state.clientDirective!=="Yes") missing.push((state.clientName||"Client")+" Personal Directive");
      if(isCouple()){
        if(state.partnerWill!=="Yes") missing.push((state.partnerName||"Partner")+" Will");
        if(state.partnerPOA!=="Yes") missing.push((state.partnerName||"Partner")+" Power of Attorney");
        if(state.partnerDirective!=="Yes") missing.push((state.partnerName||"Partner")+" Personal Directive");
      }
      if(missing.length) a.push("Legal Services — not currently confirmed: "+missing.join(", "));
      if(state.legalFit!=="Yes — it meets my needs") a.push("Legal Services — current documents/access may need review ("+D("legalFit")+")");
      a.push("Legal Services — open to learning about membership: "+D("legalInterest"));
    }
    if(state.otherNotes) a.push("Review additional client notes");
    return a;
  }

  function peopleSummary(section){
    if(section==="Personal Insurance"){
      const missing=insuranceMissingTypes();
      let rows=[
        ["Coverage types selected",D("insuranceTypes")],
        ["Not currently identified",missing.length?missing.join(", "):"None identified"],
        [state.clientName||"Client",`Life: ${D("clientLife")} | Disability: ${D("clientDisability")} | Critical Illness: ${D("clientCI")} | Health & Dental: ${D("clientHealthDental")} | Travel: ${D("clientTravel")}`]
      ];
      if(isCouple()) rows.push([state.partnerName||"Partner",`Life: ${D("partnerLife")} | Disability: ${D("partnerDisability")} | Critical Illness: ${D("partnerCI")} | Health & Dental: ${D("partnerHealthDental")} | Travel: ${D("partnerTravel")}`]);
      rows.push(["Does current coverage meet needs?",D("insuranceFit")],["Open to reviewing improvements",D("insuranceOpen")]);
      return rows;
    }
    if(section==="Investments"){
      let rows=[
        ["Accounts selected",D("investmentAccounts")],
        [state.clientName||"Client",`RRSP: ${D("clientRRSP")} | TFSA: ${D("clientTFSA")} | FHSA: ${D("clientFHSA")}`]
      ];
      if(isCouple()) rows.push([state.partnerName||"Partner",`RRSP: ${D("partnerRRSP")} | TFSA: ${D("partnerTFSA")} | FHSA: ${D("partnerFHSA")}`]);
      rows.push(["Approx. invested",D("investmentTotal")],["Primary goal",D("investmentGoal")],["Contributing regularly",D("contributingRegularly")],["Is strategy on track?",D("investmentFit")],["Open to reviewing improvements",D("investmentOpen")]);
      return rows;
    }
    if(section==="Mortgage"){
      return [["Homeowner",D("ownsHome")],["Approx. home value",D("homeValue")],["Mortgage balance",D("mortgageBalance")],["Mortgage rate",D("mortgageRate")],["Renewal",D("mortgageRenewal")],["Review interests",D("mortgageGoals")],["Does current financing meet needs?",D("mortgageFit")],["Open to referral",D("mortgageOpen")]];
    }
    if(section==="General Insurance"){
      const current=state.autoHomeTypes.filter(x=>x!=="None / Not sure");
      const needed=state.generalInsuranceNeeds.filter(x=>x!=="None / Not sure");
      const missingNeeded=needed.filter(x=>!current.includes(x));
      return [["Current coverage",D("autoHomeTypes")],["Coverage wanted / needs review",D("generalInsuranceNeeds")],["Needed but not currently identified",missingNeeded.length?missingNeeded.join(", "):"None identified"],["Last compared",D("lastCompared")],["Does coverage/pricing meet needs?",D("generalInsuranceFit")],["Open to comparison",D("openToComparison")]];
    }
    if(section==="Legal Services"){
      let rows=[[state.clientName||"Client",`Will: ${D("clientWill")} | POA: ${D("clientPOA")} | Personal Directive: ${D("clientDirective")}`]];
      if(isCouple()) rows.push([state.partnerName||"Partner",`Will: ${D("partnerWill")} | POA: ${D("partnerPOA")} | Personal Directive: ${D("partnerDirective")}`]);
      rows.push(["Do documents/legal access meet needs?",D("legalFit")],["Open to membership information",D("legalInterest")]);
      return rows;
    }
    return [];
  }

  function renderReview(){
    review=true;
    $("progressText").textContent="Review";
    $("progressPercent").textContent="100%";
    $("progressBar").style.width="100%";
    $("backBtn").style.visibility="visible";
    $("continueBtn").textContent="Email My FreedomMap to My Rep";

    const household=isCouple()?`${state.clientName} & ${state.partnerName}`:state.clientName;
    const cards=sectionOptions.filter(sec=>sec!=="Review Everything").map(sec=>{
      const selected=wants(sec);
      return `<div class="section-card"><div class="section-head"><div class="section-title">${escape(sec)}</div><div class="badge">${selected?"Selected":"Not selected"}</div></div>`+
        (selected?peopleSummary(sec).map(([l,v])=>`<div class="review-row"><div class="review-label">${escape(l)}</div><div class="review-value">${escape(v)}</div></div>`).join(""):`<div class="note">No review requested in this section.</div>`) +
      `</div>`;
    }).join("");

    $("screen").innerHTML=`
      <div class="eyebrow">Your FreedomMap</div>
      <h1>${escape(household)}</h1>
      <p class="sub">Review your answers before opening your email app. Nothing is sent automatically.</p>
      ${cards}
      <div class="action-box"><h3>Potential items to review</h3><ul>${actionItems().map(x=>`<li>${escape(x)}</li>`).join("")}</ul></div>
      <div class="review-row"><div class="review-label">Additional notes</div><div class="review-value">${escape(D("otherNotes"))}</div></div>
      <div class="note">FreedomMap organizes client-provided information to identify existing arrangements, possible gaps and areas for review. It does not make financial, insurance, mortgage, legal or investment recommendations.</div>
    `;
  }

  function emailBody(){
    const lines=[
      "FREEDOMMAP — CLIENT INTAKE",
      "",
      `Household: ${isCouple()?state.clientName+" & "+state.partnerName:state.clientName}`,
      `Household type: ${state.householdType}`,
      `Primerica Rep ID: ${state.repId}`,
      `Areas selected: ${state.sections.includes("Review Everything") ? "Review Everything" : state.sections.join(", ")}`,
      ""
    ];
    sectionOptions.filter(sec=>sec!=="Review Everything").forEach(sec=>{
      lines.push(sec.toUpperCase());
      if(!wants(sec)){ lines.push("• Not selected",""); return; }
      peopleSummary(sec).forEach(([l,v])=>lines.push(`• ${l}: ${v}`));
      lines.push("");
    });
    lines.push("POTENTIAL ITEMS TO REVIEW");
    actionItems().forEach(x=>lines.push(`• ${x}`));
    lines.push("","ADDITIONAL NOTES",state.otherNotes||"None provided");
    lines.push("","FreedomMap organizes client-provided information for review with a licensed representative or referral partner. It does not provide automatic recommendations.");
    return lines.join("\n");
  }

  function sendEmail(){
    const to=`${state.repId}@primerica.com`;
    const subject=`FreedomMap — ${isCouple()?state.clientName+" & "+state.partnerName:state.clientName}`;
    location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody())}`;
  }

  $("continueBtn").onclick=()=>{
    if(review){ sendEmail(); return; }
    const q=current();
    saveEntry(q);
    if(q.k==="repId") state.repId=state.repId.toUpperCase();
    if(!validate()) return;
    const list=visible();
    if(index<list.length-1){ index++; render(); } else renderReview();
  };

  $("backBtn").onclick=()=>{
    if(review){ review=false; index=visible().length-1; render(); return; }
    saveEntry(current());
    if(index>0){ index--; render(); }
  };

  render();
})();
</script>
</body>
</html>
