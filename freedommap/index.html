<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Financial GPS</title>
<style>
:root{
  --navy:#0b1f3a;--blue:#1463ff;--blue2:#0d4ed8;--bg:#f5f8fc;--text:#202b3c;
  --muted:#667085;--border:#dce4ef;--soft:#eef5ff;--green:#087443;--amber:#a15c00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
body{min-height:100vh}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:900;color:var(--navy);font-size:19px;letter-spacing:-.02em}
.progress-copy{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:8px;border-radius:999px;background:#e5ebf3;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s ease}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 12px 35px rgba(15,35,75,.07);padding:24px}
.eyebrow{font-size:13px;font-weight:850;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
h1{font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;color:var(--navy)}
.sub{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 22px}
label.field-label{display:block;font-weight:800;color:var(--navy);margin-bottom:8px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px;font-size:17px;outline:none}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,99,255,.12)}
textarea{min-height:110px;resize:vertical}
.options{display:grid;gap:10px}
.option{width:100%;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:14px;padding:15px 16px;text-align:left;font-weight:750;cursor:pointer;transition:.15s ease}
.option:hover{border-color:#adc5ff;background:#f8fbff}
.option.selected{border-color:var(--blue);background:var(--soft);color:var(--blue2);box-shadow:0 0 0 2px rgba(20,99,255,.08)}
.option-title{display:block;font-weight:850;color:inherit}.option-desc{display:block;margin-top:4px;font-size:13px;line-height:1.35;font-weight:600;color:var(--muted)}.option-note{display:block;margin-top:5px;font-size:12px;line-height:1.3;font-weight:750;color:var(--blue2)}
.rank-option{display:flex;align-items:center;gap:12px}.rank-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e8eef8;color:var(--navy);font-weight:900;flex:0 0 auto}.rank-option.selected .rank-num{background:var(--blue);color:#fff}.rank-reset{margin-top:12px;font-size:13px;color:var(--blue2);background:none;border:0;padding:0;font-weight:800;cursor:pointer}
.money,.percent{position:relative}.money span,.percent span{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.money span{left:16px}.money input{padding-left:34px}.percent span{right:16px}.percent input{padding-right:42px}
.actions{display:flex;gap:10px;margin-top:26px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:850;cursor:pointer;min-height:52px}
.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--navy);flex:0 0 auto}
.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.primary:hover{background:var(--blue2)}
.section-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 0}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.section-title{font-weight:900;color:var(--navy)}
.debt-group-head,.debt-entry-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.debt-add{width:38px;height:38px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:24px;font-weight:800;line-height:1;cursor:pointer;flex:0 0 auto}
.debt-entry{border-top:1px solid var(--border);margin-top:16px;padding-top:16px}.debt-entry.first{border-top:0;margin-top:0;padding-top:4px}
.debt-entry-title{font-size:13px;font-weight:900;color:var(--muted)}
.debt-remove{border:0;background:none;color:#b42318;font-size:12px;font-weight:850;cursor:pointer;padding:4px}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#eef5ff;color:var(--blue2)}
.edit-section{border:1px solid var(--border);background:#fff;color:var(--blue2);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:850;cursor:pointer}
.review-row{padding:12px 0;border-top:1px solid var(--border)}.review-row:first-child{border-top:0}
.review-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:3px}.review-value{font-size:15px;color:var(--navy);white-space:pre-wrap}
.summary-group{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.summary-group:first-of-type{margin-top:0;border-top:0;padding-top:0}
.summary-subhead{font-size:13px;font-weight:900;color:var(--navy);margin-bottom:9px}
.summary-grid{display:grid;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.summary-line{display:grid;grid-template-columns:minmax(125px,1fr) minmax(150px,1.35fr);gap:12px;padding:10px 12px;border-top:1px solid var(--border);align-items:start}
.summary-line:first-child{border-top:0}
.summary-key{font-size:12px;font-weight:850;color:var(--muted)}
.summary-val{font-size:14px;font-weight:700;color:var(--navy)}
.summary-val.attention{font-weight:900;color:#9a3412}
.account-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:9px}
.account-card:first-child{margin-top:0}
.account-name{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:9px}
.account-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.account-stat{background:#f8fbff;border-radius:10px;padding:10px}
.account-stat-label{font-size:11px;font-weight:850;color:var(--muted);margin-bottom:3px}
.account-stat-value{font-size:14px;font-weight:850;color:var(--navy)}
.summary-tags{display:flex;flex-wrap:wrap;gap:7px}
.summary-tag{border:1px solid var(--border);background:#f8fbff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:750;color:var(--navy)}
@media(max-width:520px){.summary-line{grid-template-columns:1fr}.account-stats{grid-template-columns:1fr}}
.action-box{background:#f8fbff;border:1px solid #d8e5ff;border-radius:16px;padding:16px;margin-top:18px}
.action-box h3{margin:0 0 10px;color:var(--navy);font-size:17px}.action-box ul{padding-left:20px;margin:0}.action-box li{margin:7px 0}
.note{font-size:12px;line-height:1.45;color:var(--muted);margin-top:12px}.error{font-size:13px;color:#b42318;font-weight:700;margin-top:8px}
@media(min-width:700px){.app{padding-top:30px}.card{padding:34px}h1{font-size:36px}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.topbar,.progress-copy,.progress,.actions,.edit-section{display:none!important}.card{border:0;box-shadow:none;padding:0}.section-card{break-inside:avoid}h1{font-size:28px}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand">Financial GPS</div>
  </div>

  <div class="progress-copy"><span id="progressText">Question 1</span><span id="progressPercent">0%</span></div>
  <div class="progress"><div id="progressBar"></div></div>

  <section class="card">
    <div id="screen"></div>
    <div class="actions">
      <button class="btn secondary" id="backBtn" type="button">Back</button>
      <button class="btn secondary" id="emailBtn" type="button" style="display:none">Email</button>
      <button class="btn primary" id="continueBtn" type="button">Continue</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {
    householdType:"",
    clientFirstName:"",
    clientLastInitial:"",
    partnerFirstName:"",
    partnerLastInitial:"",
    clientName:"",
    partnerName:"",
    clientAge:"",
    partnerAge:"",
    clientOccupationStatus:"",
    partnerOccupationStatus:"",
    clientIncome:"",
    partnerIncome:"",
    hasDependants:"",
    dependantAges:"",
    monthlyAvailable:"",
    emergencyFund:"",
    dtcApproved:"",
    dtcApprovedWho:"",
    sections:["Investments","Mortgage & Debt Elimination","Personal Insurance","General Insurance (Home & Auto)","Legal Services"],
    rankedAreas:[],

    clientLife:"",
    clientLifeDetails:{coverage:"",premium:"",type:""},
    partnerLife:"",
    partnerLifeDetails:{coverage:"",premium:"",type:""},
    clientDisability:"",
    clientDisabilityDetails:{coverage:"",premium:""},
    partnerDisability:"",
    partnerDisabilityDetails:{coverage:"",premium:""},
    clientCI:"",
    clientCIDetails:{coverage:"",premium:""},
    partnerCI:"",
    partnerCIDetails:{coverage:"",premium:""},
    clientHealthDental:"",
    partnerHealthDental:"",
    clientTravel:"",
    partnerTravel:"",
    insuranceFit:"",
    insuranceOpen:"",

    investmentAccounts:[],
    investmentDetails:{},
    investmentGoals:[],
    clientRetirementAge:"",
    partnerRetirementAge:"",
    retirementTargetKnowledge:"",
    taxOptimizationKnowledge:"",
    retirementDurationKnowledge:"",
    investmentOpen:"",

    housingSituation:"",
    homeBuyTimeframe:"",
    homeValueRange:"",
    mortgageBalanceRange:"",
    mortgagePayment:"",
    mortgageRateRange:"",
    mortgageRenewalDate:"",
    mortgageSource:"",
    hasNonMortgageDebt:"",
    debtTypes:[],
    debtDetails:{},
    mortgageOpen:"",

    generalInsuranceNeeds:[],
    lastCompared:"",
    generalInsuranceRenewalDate:"",
    openToComparison:"",

    clientLegalDocuments:[],
    partnerLegalDocuments:[],
    legalInterest:"",

    investmentNotes:"",
    personalInsuranceNotes:"",
    mortgageDebtNotes:"",
    generalInsuranceNotes:"",
    legalServicesNotes:""
  };

  const sectionOptions = [
    "Investments",
    "Mortgage & Debt Elimination",
    "Personal Insurance",
    "General Insurance (Home & Auto)",
    "Legal Services"
  ];

  const sectionMeta = {
    "Personal Insurance": {
      title: "Personal Insurance",
      desc: "Life, Disability, Critical Illness, Health & Dental, Travel",
      note: "Access to multiple personal insurance carriers"
    },
    "Investments": {
      title: "Investments",
      desc: "Retirement, Home Downpayment, Education & Wealth Building",
      note: "Access to RRSPs, Spousal RRSPs, TFSAs, FHSAs, RESPs, RDSPs & multiple investment firms"
    },
    "Mortgage & Debt Elimination": {
      title: "Mortgage & Debt Elimination",
      desc: "Purchase, Renewal, Refinance, Debt Consolidation & Debt Elimination",
      note: "Access to 65+ lenders"
    },
    "General Insurance (Home & Auto)": {
      title: "General Insurance (Home & Auto)",
      desc: "Home, Auto, Condo, Tenant, Landlord, Recreational & Business Insurance",
      note: "Access to multiple general insurance companies"
    },
    "Legal Services": {
      title: "Legal Services",
      desc: "Wills, Powers of Attorney, Personal Directives & Ongoing Legal Advice",
      note: "Membership access to lawyers for legal guidance"
    }
  };

  const investmentAccountsSingle = () => [
    "RRSP",
    "Spousal RRSP",
    "TFSA",
    "FHSA",
    "Family RESP",
    "Individual RESP",
    "RDSP",
    "Workplace pension / group plan",
    "Non-registered investments",
    ...(state.clientOccupationStatus==="Corporate owner" ? ["Corporate investments / retained earnings"] : []),
    "None",
    "Not sure"
  ];
  const investmentAccountsCouple = () => [
    (state.clientName || "Person 1") + " RRSP",
    (state.partnerName || "Person 2") + " RRSP",
    (state.clientName || "Person 1") + " Spousal RRSP",
    (state.partnerName || "Person 2") + " Spousal RRSP",
    (state.clientName || "Person 1") + " TFSA",
    (state.partnerName || "Person 2") + " TFSA",
    (state.clientName || "Person 1") + " FHSA",
    (state.partnerName || "Person 2") + " FHSA",
    (state.clientName || "Person 1") + " RDSP",
    (state.partnerName || "Person 2") + " RDSP",
    "Family RESP",
    "Individual RESP",
    (state.clientName || "Person 1") + " Workplace pension / group plan",
    (state.partnerName || "Person 2") + " Workplace pension / group plan",
    "Non-registered investments",
    ...(state.clientOccupationStatus==="Corporate owner" ? [(state.clientName || "Person 1") + " Corporate investments / retained earnings"] : []),
    ...(state.partnerOccupationStatus==="Corporate owner" ? [(state.partnerName || "Person 2") + " Corporate investments / retained earnings"] : []),
    "None",
    "Not sure"
  ];
  const investmentGoals = ["Retirement","Home downpayment","Children's education","Building wealth","Emergency / short-term savings","Other","Not sure"];

  const housingSituations = ["Own with a mortgage","Own mortgage-free","Renting","Living with family / other","Not sure"];
  const debtTypes = ["Credit cards","Line of credit","Vehicle loan","Personal loan","Student loan","CRA / tax debt","Other"];

  const generalInsuranceOptions = ["Auto","Home","Condo","Tenant","Landlord / rental property","Motorcycle / recreational vehicle","Business / commercial","Other","Not sure"];
  const legalDocumentOptions = ["Will","Enduring Power of Attorney","Personal Directive","None","Not sure"];

  const coverageSourceOptions = ["Individual policy","Group coverage through work","Both individual and group coverage","None","Not sure"];
  const fitOptions = ["Yes","Mostly","Not sure"];
  const opennessOptions = ["Yes","Maybe","No"];

  function isCouple(){ return state.householdType === "Couple"; }
  function personDisplayName(first,lastInitial){
    const f=String(first||"").trim();
    const l=String(lastInitial||"").replace(/[^A-Za-z]/g,"").slice(0,1).toUpperCase();
    return [f,l?l+".":""].filter(Boolean).join(" ");
  }
  function syncDisplayNames(){
    state.clientName=personDisplayName(state.clientFirstName,state.clientLastInitial);
    state.partnerName=personDisplayName(state.partnerFirstName,state.partnerLastInitial);
  }
  function wants(){ return true; }
  function rankableAreas(){
    const open=["Yes","Maybe"];
    const areas=[];
    if(open.includes(state.investmentOpen)) areas.push("Investments");
    if(shouldAskMortgageOpen() && open.includes(state.mortgageOpen)) areas.push("Mortgage & Debt Elimination");
    if(open.includes(state.insuranceOpen)) areas.push("Personal Insurance");
    if(open.includes(state.openToComparison)) areas.push("General Insurance (Home & Auto)");
    if(open.includes(state.legalInterest)) areas.push("Legal Services");
    return areas;
  }
  function selectedInvestmentAccounts(){
    return state.investmentAccounts.filter(x=>!["None","Not sure"].includes(x));
  }
  function investmentEntries(account){
    const current=state.investmentDetails[account];
    if(Array.isArray(current)){
      if(!current.length) current.push({balance:"",contribution:"",employerContribution:"",fullMatch:""});
      return current;
    }
    if(current && typeof current==="object"){
      state.investmentDetails[account]=[{
        balance:current.balance||"",
        contribution:current.contribution||"",
        employerContribution:current.employerContribution||"",
        fullMatch:current.fullMatch||""
      }];
    } else {
      state.investmentDetails[account]=[{balance:"",contribution:"",employerContribution:"",fullMatch:""}];
    }
    return state.investmentDetails[account];
  }
  function isWorkplaceAccount(account){ return account.includes("Workplace pension / group plan"); }
  function isCorporateInvestmentAccount(account){ return account.includes("Corporate investments / retained earnings"); }
  function hasIndividualPolicy(source){ return ["Individual policy","Both individual and group coverage"].includes(source); }
  function isNonHomeowner(){
    return !!state.housingSituation && !["Own with a mortgage","Own mortgage-free"].includes(state.housingSituation);
  }
  function nonHomeownerPlansToBuy(){
    return isNonHomeowner() && state.homeBuyTimeframe && state.homeBuyTimeframe!=="I don’t plan to buy a house";
  }
  function shouldAskMortgageOpen(){
    const hasDebt=state.hasNonMortgageDebt==="Yes" || state.hasNonMortgageDebt==="Not sure";
    if(isNonHomeowner()){
      if(nonHomeownerPlansToBuy()) return true;
      return hasDebt;
    }
    if(state.housingSituation==="Own with a mortgage") return true;
    if(state.housingSituation==="Own mortgage-free") return hasDebt;
    return false;
  }
  function mortgageOpenQuestion(){
    const hasDebt=state.hasNonMortgageDebt==="Yes" || state.hasNonMortgageDebt==="Not sure";
    if(isNonHomeowner()){
      if(nonHomeownerPlansToBuy() && hasDebt) return "Would you be open to reviewing mortgage and debt elimination options?";
      if(nonHomeownerPlansToBuy()) return "Would you be open to reviewing mortgage options?";
      return "Would you be open to reviewing debt elimination options?";
    }
    if(state.housingSituation==="Own with a mortgage"){
      return hasDebt
        ? "Would you be open to reviewing mortgage and debt elimination options?"
        : "Would you be open to reviewing mortgage options?";
    }
    return "Would you be open to reviewing debt elimination options?";
  }
  function debtEntries(debt){
    const current=state.debtDetails[debt];
    if(Array.isArray(current)){
      if(!current.length) current.push({balance:"",rate:"",payment:""});
      return current;
    }
    if(current && typeof current==="object"){
      state.debtDetails[debt]=[{balance:current.balance||"",rate:current.rate||"",payment:current.payment||""}];
    } else {
      state.debtDetails[debt]=[{balance:"",rate:"",payment:""}];
    }
    return state.debtDetails[debt];
  }

  const reviewSections = [
    "Household Basics",
    "Investments",
    "Mortgage & Debt Elimination",
    "Personal Insurance",
    "General Insurance (Home & Auto)",
    "Legal Services"
  ];
  const sectionReviewItems = Object.fromEntries(
    reviewSections.map(section=>[section,{
      k:"__summary__"+section,
      section:"Review",
      y:"sectionSummary",
      summaryThrough:section
    }])
  );

  const Q = [
    {k:"householdType", section:"Start", t:"Who is completing this Financial GPS?", s:"We'll tailor the questions for one person or a couple.", y:"single", o:["Just me","Couple"], r:true},
    {k:"clientFirstName", section:"Start", t:()=>isCouple()?"What is the first person's first name?":"What is your first name?", s:"Enter first name only.", y:"firstName", p:"First name", r:true},
    {k:"clientLastInitial", section:"Start", t:()=>isCouple()?("What is "+(state.clientFirstName || "the first person")+"'s last initial?"):"What is your last initial?", s:"Enter only the first letter of the last name.", y:"lastInitial", p:"C", r:true},
    {k:"partnerFirstName", section:"Start", t:"What is your spouse or partner's first name?", s:"Enter first name only.", y:"firstName", p:"First name", r:true, v:()=>isCouple()},
    {k:"partnerLastInitial", section:"Start", t:()=>("What is "+(state.partnerFirstName || "your partner")+"'s last initial?"), s:"Enter only the first letter of the last name.", y:"lastInitial", p:"C", r:true, v:()=>isCouple()},
    {k:"clientAge", section:"Household Basics", t:()=>isCouple()?("How old is "+(state.clientName || "the first person")+"?"):"How old are you?", s:"Enter current age.", y:"number", p:"Age", r:true},
    {k:"clientOccupationStatus", section:"Household Basics", t:()=>isCouple()?("What is "+(state.clientName || "the first person")+"\'s current work status?"):"What is your current work status?", s:"Choose the closest answer.", y:"single", o:["Employed","Self-employed","Corporate owner","Retired","Homemaker","Not currently working","Other"], r:true},
    {k:"partnerAge", section:"Household Basics", t:()=>("How old is "+(state.partnerName || "your partner")+"?"), s:"Enter current age.", y:"number", p:"Age", r:true, v:()=>isCouple()},
    {k:"partnerOccupationStatus", section:"Household Basics", t:()=>("What is "+(state.partnerName || "your partner")+"\'s current work status?"), s:"Choose the closest answer.", y:"single", o:["Employed","Self-employed","Corporate owner","Retired","Homemaker","Not currently working","Other"], r:true, v:()=>isCouple()},
    {k:"clientIncome", section:"Household Basics", t:()=>isCouple()?("What is "+(state.clientName || "the first person")+" annual gross income?"):"What is your annual gross income?", s:"Enter annual income before tax.", y:"money", p:"0", r:true},
    {k:"partnerIncome", section:"Household Basics", t:()=>("What is "+(state.partnerName || "your partner")+" annual gross income?"), s:"Enter annual income before tax.", y:"money", p:"0", r:true, v:()=>isCouple()},
    {k:"hasDependants", section:"Household Basics", t:"Do you have children or other dependants?", s:"Choose the closest answer.", y:"single", o:["Yes","No"], r:true},
    {k:"dependantAges", section:"Household Basics", t:"What are the ages of your children or other dependants?", s:"Separate multiple ages with commas.", y:"text", p:"Example: 8, 5", r:true, v:()=>state.hasDependants==="Yes"},
    {k:"monthlyAvailable", section:"Household Basics", t:"About how much is available each month after regular expenses and debt payments?", s:"Enter the amount currently available for saving, investing or debt reduction.", y:"money", p:"0", r:true},
    {k:"emergencyFund", section:"Household Basics", t:"How much do you currently have set aside for emergencies?", s:"Enter your current emergency savings.", y:"money", p:"0", r:true},
    {k:"dtcApproved", section:"Household Basics", t:"Does anyone in your household already qualify for the Disability Tax Credit (DTC)?", s:"Choose the closest answer.", y:"single", o:["Yes","No","Not sure"], r:true},
    {k:"dtcApprovedWho", section:"Household Basics", t:"Who has been approved for the DTC?", s:"Enter the person or people who have DTC approval.", y:"text", p:"Example: Me, spouse, child", r:true, v:()=>state.dtcApproved==="Yes"},
    {k:"clientRetirementAge", section:"Investments", t:()=>isCouple()?("At what age would "+(state.clientName || "the first person")+" like to retire?"):"At what age would you like to retire?", s:"Enter target retirement age.", y:"number", p:"Retirement age", r:true},
    {k:"partnerRetirementAge", section:"Investments", t:()=>("At what age would "+(state.partnerName || "your partner")+" like to retire?"), s:"Enter target retirement age.", y:"number", p:"Retirement age", r:true, v:()=>isCouple()},
    {k:"investmentAccounts", section:"Investments", t:"Which savings or investment accounts do you currently have?", s:"Choose all that apply. Corporate owners can also include corporate investments or retained earnings.", y:"multi", o:investmentAccountsSingle, r:true, v:()=>wants("Investments") && !isCouple()},
    {k:"investmentAccounts", section:"Investments", t:"Which savings or investment accounts do you currently have?", s:"Choose all that apply. Corporate owners can also include corporate investments or retained earnings.", y:"multi", o:investmentAccountsCouple, r:true, v:()=>wants("Investments") && isCouple()},
    {k:"investmentDetails", section:"Investments", t:"Enter the details for your investment accounts", s:"Enter the current balance and monthly contribution for each account. Use + to add another account of the same type.", y:"investmentDetails", r:true, v:()=>wants("Investments") && selectedInvestmentAccounts().length>0},
    {k:"investmentGoals", section:"Investments", t:"What are you currently saving or investing for?", s:"Choose all that apply.", y:"multi", o:investmentGoals, r:true, v:()=>wants("Investments")},
    {k:"retirementTargetKnowledge", section:"Investments", t:"Do you know how much you need to have saved to reach your retirement goal?", s:"Choose the closest answer.", y:"single", o:["Yes","I have an estimate","Not sure"], r:true, v:()=>wants("Investments")},

  let index=0, review=false, navHistory=[], editReturnKey="", editSection="";

  function visible(){
    const questions=Q.filter(q=>!q.v || q.v());
    const out=[];
    questions.forEach((q,i)=>{
      out.push(q);
      const next=questions[i+1];
      if(reviewSections.includes(q.section) && (!next || next.section!==q.section)){
        out.push(sectionReviewItems[q.section]);
      }
    });
    return out;
  }
  function current(){ const list=visible(); if(index>=list.length) index=Math.max(0,list.length-1); return list[index]; }
  function rememberCurrent(){
    const screen=review ? {review:true} : {review:false,item:current()};
    if(!screen.review && !screen.item) return;
    const last=navHistory[navHistory.length-1];
    const same=last && last.review===screen.review && (screen.review || last.item===screen.item);
    if(!same) navHistory.push(screen);
  }
  function returnToHistory(){
    const list=visible();
    const hereReview=review;
    const hereItem=review ? null : current();
    while(navHistory.length){
      const target=navHistory.pop();
      if(target.review){
        if(!hereReview){
          renderReview();
          return true;
        }
        continue;
      }
      const targetIndex=list.indexOf(target.item);
      if(targetIndex>=0 && (hereReview || target.item!==hereItem)){
        review=false;
        index=targetIndex;
        render();
        return true;
      }
    }
    return false;
  }
  function title(q){ return typeof q.t==="function" ? q.t() : q.t; }
  function escape(v){ return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function formatNumberInput(v){
    const raw=String(v??"").replace(/,/g,"").replace(/[^0-9.]/g,"");
    if(!raw) return "";
    const parts=raw.split(".");
    const whole=(parts.shift()||"0").replace(/^0+(?=\d)/,"");
    const grouped=whole.replace(/\B(?=(\d{3})+(?!\d))/g,",");
    return parts.length ? grouped+"."+parts.join("").slice(0,2) : grouped;
  }

  function saveEntry(q){
    if(q.y==="investmentDetails"){
      document.querySelectorAll("[data-invest-account][data-invest-index][data-invest-field]").forEach(el=>{
        const account=el.dataset.investAccount;
        const idx=Number(el.dataset.investIndex);
        const type=el.dataset.investField;
        const raw=type==="fullMatch" ? el.value : el.value.trim().replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
        const entries=investmentEntries(account);
        if(!entries[idx]) entries[idx]={balance:"",contribution:"",employerContribution:"",fullMatch:""};
        entries[idx][type]=raw;
      });
      return;
    }
    if(q.y==="debtDetails"){
      document.querySelectorAll("[data-debt-type][data-debt-index][data-debt-field]").forEach(el=>{
        const debt=el.dataset.debtType;
        const idx=Number(el.dataset.debtIndex);
        const type=el.dataset.debtField;
        const raw=el.value.trim().replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
        const entries=debtEntries(debt);
        if(!entries[idx]) entries[idx]={balance:"",rate:"",payment:""};
        entries[idx][type]=raw;
      });
      return;
    }
    if(["lifeDetails","coveragePremiumDetails"].includes(q.y)){
      const details=state[q.k];
      document.querySelectorAll("[data-ins-field]").forEach(el=>{
        const type=el.dataset.insField;
        details[type]=type==="type" ? el.value : el.value.trim().replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
      });
      return;
    }
    const e=$("entry");
    if(!e) return;
    let v=e.value.trim();
    if(q.y==="dateOrNotSure" && state[q.k]==="Not sure" && !v) return;
    if(["money","percent"].includes(q.y)) v=v.replace(/[$,%\s,]/g,"").replace(/[^0-9.]/g,"");
    if(q.y==="firstName") v=v.replace(/\s+/g," ").trim();
    if(q.y==="lastInitial") v=v.replace(/[^A-Za-z]/g,"").slice(0,1).toUpperCase();
    state[q.k]=q.save?q.save(v):v;
    if(["clientFirstName","clientLastInitial","partnerFirstName","partnerLastInitial"].includes(q.k)) syncDisplayNames();
  }

    if(q.y==="debtDetails"){

        return '<div class="section-card" style="margin:0">'+

          entries.map((d,idx)=>'<div class="debt-entry '+(idx===0?'first':'')+'">'+
            (entries.length>1?'<div class="debt-entry-head"><div class="debt-entry-title">'+escape(debt)+' '+(idx+1)+'</div><button type="button" class="debt-remove" data-remove-debt="'+escape(debt)+'" data-remove-index="'+idx+'">Remove</button></div>':'')+
            '<label class="field-label"'+(entries.length>1?' style="margin-top:12px"':'')+'>Current balance</label><div class="money"><span>$</span><input data-debt-type="'+escape(debt)+'" data-debt-index="'+idx+'" data-debt-field="balance" data-money-input inputmode="decimal" value="'+escape(formatNumberInput(d.balance||""))+'" placeholder="0"></div>'+
            '<label class="field-label" style="margin-top:14px">Interest rate</label><div class="percent"><input data-debt-type="'+escape(debt)+'" data-debt-index="'+idx+'" data-debt-field="rate" inputmode="decimal" value="'+escape(d.rate||"")+'" placeholder="0.00"><span>%</span></div>'+

          '</div>').join("")+
        '</div>';

      const d=state[q.k];

        '</div>';
    }
    if(q.y==="coveragePremiumDetails"){
      const d=state[q.k];
      return '<div class="section-card" style="margin:0">'+

    if(q.y==="rank"){
      const options=typeof q.o==="function" ? q.o() : q.o;
      state.rankedAreas=state.rankedAreas.filter(x=>options.includes(x));
      return '<div class="options">'+options.map(o=>{
        const pos=state.rankedAreas.indexOf(o);
        return '<button type="button" class="option rank-option '+(pos>=0?"selected":"")+'" data-rank="'+escape(o)+'"><span class="rank-num">'+(pos>=0?(pos+1):"")+'</span><span>'+escape(o)+'</span></button>';
      }).join("")+'</div>'+(state.rankedAreas.length?'<button type="button" class="rank-reset" id="rankReset">Reset ranking</button>':'');

    if(q.y==="text"||q.y==="number") return `<label class="field-label" for="entry">Your answer</label><input id="entry" type="${q.y}" value="${escape(state[q.k])}" placeholder="${escape(q.p||"")}">`;

    if(q.y==="textarea") return `<label class="field-label" for="entry">Optional details</label><textarea id="entry" placeholder="${escape(q.p||"")}">${escape(state[q.k])}</textarea>`;
    const multi=q.y==="multi";
    const options=typeof q.o==="function" ? q.o() : q.o;
    return `<div class="options">${options.map(o=>{
      const sel=multi?state[q.k].includes(o):(q.k==="householdType" ? (o==="Just me" ? (state[q.k]==="Just me" || state[q.k]==="Single") : state[q.k]===o) : state[q.k]===o);
      return `<button type="button" class="option ${sel?"selected":""}" data-option="${escape(o)}">${escape(o)}</button>`;
    }).join("")}</div>`;
  }

  function render(){
    review=false;
    const list=visible(), q=current();
    if(q.y==="sectionSummary"){
      renderProgressiveSummary(q);
      return;
    }
    const questions=list.filter(x=>x.y!=="sectionSummary");
    const qPos=questions.indexOf(q);
    const pct=Math.round(Math.max(0,qPos)/Math.max(1,questions.length)*100);
    $("progressText").textContent=`Question ${qPos+1} of ${questions.length}`;
    $("progressPercent").textContent=pct+"%";
    $("progressBar").style.width=pct+"%";
    $("backBtn").style.visibility=index===0?"hidden":"visible";
    $("emailBtn").style.display="none";
    $("continueBtn").style.display="block";
    $("continueBtn").textContent=(q.y==="rank" ? "View Final Summary" : "Continue");
    $("screen").innerHTML=`<div class="eyebrow">${escape(q.section)}</div><h1>${escape(title(q))}</h1><p class="sub">${escape(q.s||"")}</p>${field(q)}<div id="errorBox"></div>`;
    document.querySelectorAll("[data-money-input]").forEach(input=>{
      input.addEventListener("input",()=>{
        input.value=formatNumberInput(input.value);
      });
    });
    if(q.y==="lastInitial"){
      const lastInitialInput=$("entry");
      if(lastInitialInput){
        lastInitialInput.addEventListener("input",()=>{
          lastInitialInput.value=lastInitialInput.value.replace(/[^A-Za-z]/g,"").slice(0,1).toUpperCase();
        });
      }
    }
    document.querySelectorAll("[data-add-invest]").forEach(btn=>{
      btn.onclick=()=>{
        saveEntry(q);
        investmentEntries(btn.dataset.addInvest).push({balance:"",contribution:"",employerContribution:"",fullMatch:""});
        render();
      };
    });
    document.querySelectorAll("[data-remove-invest]").forEach(btn=>{
      btn.onclick=()=>{
        saveEntry(q);
        const entries=investmentEntries(btn.dataset.removeInvest);
        const idx=Number(btn.dataset.removeInvestIndex);
        if(entries.length>1) entries.splice(idx,1);
        render();
      };
    });
    document.querySelectorAll("[data-add-debt]").forEach(btn=>{
      btn.onclick=()=>{
        saveEntry(q);
        debtEntries(btn.dataset.addDebt).push({balance:"",rate:"",payment:""});
        render();
      };
    });
    document.querySelectorAll("[data-remove-debt]").forEach(btn=>{
      btn.onclick=()=>{
        saveEntry(q);
        const entries=debtEntries(btn.dataset.removeDebt);
        const idx=Number(btn.dataset.removeIndex);
        if(entries.length>1) entries.splice(idx,1);
        render();
      };
    });
    document.querySelectorAll("[data-rank]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.dataset.rank;
        if(state.rankedAreas.includes(val)){
          state.rankedAreas=state.rankedAreas.filter(x=>x!==val);
        } else if(state.rankedAreas.length<rankableAreas().length){
          state.rankedAreas=state.rankedAreas.concat(val);
        }
        render();
      };
    });
    const rankReset=$("rankReset");
    if(rankReset) rankReset.onclick=()=>{ state.rankedAreas=[]; render(); };

    document.querySelectorAll("[data-date-unknown]").forEach(btn=>{
      btn.onclick=()=>{
        state[q.k]=state[q.k]==="Not sure" ? "" : "Not sure";
        render();
      };
    });

    document.querySelectorAll("[data-option]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.dataset.option;

        if(q.y==="multi"){
          const exclusive=["None / Not sure","None","Not sure","I’m not sure — review my needs"];
          if(exclusive.includes(val)){
            state[q.k]=state[q.k].includes(val)?[]:[val];
          } else {
            state[q.k]=state[q.k].filter(x=>!exclusive.includes(x));
            state[q.k]=state[q.k].includes(val)?state[q.k].filter(x=>x!==val):state[q.k].concat(val);
          }
        } else {
          if(q.k==="householdType"){
            state[q.k]=val;
          } else {
            state[q.k]=q.save?q.save(val):val;
          }
        }
        render();
      };
    });
  }

  function validate(){
    return true;
  }

  function D(k){
    const v=state[k];
    if(Array.isArray(v)) return v.length?v.join(", "):"Not provided";
    return v||"Not provided";
  }

  function moneyD(k){ const v=Number(state[k]); return state[k]!=="" && Number.isFinite(v) ? v.toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided"; }
  function percentD(k){ return state[k]!=="" ? state[k]+"%" : "Not provided"; }
  function dateD(k){
    const v=state[k];
    if(!v) return "Not provided";
    const d=new Date(v+"T00:00:00Z");
    return Number.isNaN(d.getTime()) ? v : d.toLocaleDateString("en-CA",{year:"numeric",month:"long",day:"numeric",timeZone:"UTC"});
  }

  function sectionStatus(name){
    return wants(name) ? "Selected" : "Not selected";
  }

  function peopleSummary(section){
    if(section==="Personal Insurance"){
      let rows=[
        [state.clientName||"Client",`Life: ${D("clientLife")} | Disability: ${D("clientDisability")} | Critical Illness: ${D("clientCI")} | Health & Dental: ${D("clientHealthDental")} | Travel: ${D("clientTravel")}`]
      ];
      if(isCouple()) rows.push([state.partnerName||"Partner",`Life: ${D("partnerLife")} | Disability: ${D("partnerDisability")} | Critical Illness: ${D("partnerCI")} | Health & Dental: ${D("partnerHealthDental")} | Travel: ${D("partnerTravel")}`]);
      rows.push(["Does current coverage meet needs?",D("insuranceFit")],["Open to reviewing options",D("insuranceOpen")]);
      return rows;
    }
    if(section==="Investments"){
      const rows=[["Current accounts",D("investmentAccounts")],["Target retirement age",D("clientRetirementAge")]];
      if(isCouple()) rows.push([(state.partnerName||"Partner")+" target retirement age",D("partnerRetirementAge")]);
      selectedInvestmentAccounts().forEach(account=>{
        const entries=investmentEntries(account);
        entries.forEach((d,idx)=>{
          const balance=d.balance!==undefined && d.balance!=="" ? Number(d.balance).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided";
          const contribution=d.contribution!==undefined && d.contribution!=="" ? Number(d.contribution).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "Not provided";
          const employer=isWorkplaceAccount(account) && d.employerContribution!==undefined && d.employerContribution!=="" ? Number(d.employerContribution).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "";
          const fullMatch=isWorkplaceAccount(account) ? (d.fullMatch||"Not provided") : "";
          const label=entries.length>1 ? account+" "+(idx+1) : account;
          rows.push([label, "Balance: "+balance+" | Contribution: "+contribution+(employer?" | Employer: "+employer:"")+(fullMatch?" | Full employer match: "+fullMatch:"")]);
        });
      });
      rows.push(
        ["Saving / investing for",D("investmentGoals")],
        ["Knows retirement savings target",D("retirementTargetKnowledge")],
        ["Knows whether strategy is tax-efficient",D("taxOptimizationKnowledge")],
        ["Knows how long retirement savings may last",D("retirementDurationKnowledge")],
        ["Open to reviewing other options",D("investmentOpen")]
      );
      return rows;
    }
    if(section==="Mortgage & Debt Elimination"){
      const rows=[
        ["Housing situation",D("housingSituation")]
      ];
      if(isNonHomeowner()){
        rows.push(["Home purchase timeframe",D("homeBuyTimeframe")]);
      }
      if(["Own with a mortgage","Own mortgage-free"].includes(state.housingSituation)){
        rows.push(["Home value",moneyD("homeValueRange")]);
      }
      if(state.housingSituation==="Own with a mortgage"){
        rows.push(["Mortgage balance",moneyD("mortgageBalanceRange")],["Monthly mortgage payment",moneyD("mortgagePayment")],["Mortgage interest rate",percentD("mortgageRateRange")],["Mortgage renewal date",state.mortgageRenewalDate==="Not sure"?"Not sure":dateD("mortgageRenewalDate")],["Mortgage arranged through",D("mortgageSource")]);
      }
      rows.push(["Non-mortgage debt",D("hasNonMortgageDebt")]);
      if(state.hasNonMortgageDebt==="Yes"){
        rows.push(["Debt types",D("debtTypes")]);
        state.debtTypes.forEach(debt=>{
          const entries=debtEntries(debt);
          entries.forEach((d,idx)=>{
            const balance=d.balance!==undefined && d.balance!=="" ? Number(d.balance).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided";
            const rate=d.rate!==undefined && d.rate!=="" ? d.rate+"%" : "Not provided";
            const payment=d.payment!==undefined && d.payment!=="" ? Number(d.payment).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "Not provided";
            const label=entries.length>1 ? debt+" "+(idx+1) : debt;
            rows.push([label,"Balance: "+balance+" | Rate: "+rate+" | Payment: "+payment]);
          });
        });
      }
      if(shouldAskMortgageOpen()){
        let openLabel="Open to reviewing debt elimination options";
        const hasDebt=state.hasNonMortgageDebt==="Yes" || state.hasNonMortgageDebt==="Not sure";
        if(isNonHomeowner() && nonHomeownerPlansToBuy()){
          openLabel=hasDebt ? "Open to reviewing mortgage & debt elimination options" : "Open to reviewing mortgage options";
        } else if(state.housingSituation==="Own with a mortgage"){
          openLabel=hasDebt ? "Open to reviewing mortgage & debt elimination options" : "Open to reviewing mortgage options";
        }
        rows.push([openLabel,D("mortgageOpen")]);
      }
      return rows;
    }
    if(section==="General Insurance (Home & Auto)"){
      return [
        ["Last compared Home & Auto with a broker",D("lastCompared")],
        ["General insurance types",D("generalInsuranceNeeds")],
        ["Next Home / Auto renewal",state.generalInsuranceRenewalDate==="Not sure"?"Not sure":dateD("generalInsuranceRenewalDate")],
        ["Open to no-obligation comparison",D("openToComparison")]
      ];
    }
    if(section==="Legal Services"){
      const rows=[[state.clientName||"Client",D("clientLegalDocuments")]];
      if(isCouple()) rows.push([state.partnerName||"Partner",D("partnerLegalDocuments")]);
      rows.push(["Open to reviewing missing / outdated documents",D("legalInterest")]);
      return rows;
    }
    return [];
  }

  function attentionClass(v){
    return ["None","Not sure","No","Not provided"].includes(v) ? " attention" : "";
  }

  function renderInsuranceSummary(){
    const moneyFrom=(obj,key)=>obj && obj[key]!==undefined && obj[key]!=="" ? Number(obj[key]).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided";
    const personBlock=(name,isPartner)=>{
      const lifeSource=D(isPartner?"partnerLife":"clientLife");
      const life=state[isPartner?"partnerLifeDetails":"clientLifeDetails"]||{};
      const disabilitySource=D(isPartner?"partnerDisability":"clientDisability");
      const disability=state[isPartner?"partnerDisabilityDetails":"clientDisabilityDetails"]||{};
      const ciSource=D(isPartner?"partnerCI":"clientCI");
      const ci=state[isPartner?"partnerCIDetails":"clientCIDetails"]||{};
      const health=D(isPartner?"partnerHealthDental":"clientHealthDental");
      const travel=D(isPartner?"partnerTravel":"clientTravel");
      const lifeDisplay=hasIndividualPolicy(lifeSource) ? lifeSource+" — "+moneyFrom(life,"coverage")+" coverage | "+moneyFrom(life,"premium")+"/month | "+(life.type||"Not provided") : lifeSource;
      const disabilityDisplay=hasIndividualPolicy(disabilitySource) ? disabilitySource+" — "+moneyFrom(disability,"coverage")+" coverage | "+moneyFrom(disability,"premium")+"/month" : disabilitySource;
      const ciDisplay=hasIndividualPolicy(ciSource) ? ciSource+" — "+moneyFrom(ci,"coverage")+" coverage | "+moneyFrom(ci,"premium")+"/month" : ciSource;
      const rows=[
        ["Life Insurance",lifeDisplay],
        ["Disability Insurance",disabilityDisplay],
        ["Critical Illness Insurance",ciDisplay],
        ["Health & Dental",health],
        ["Travel Insurance",travel]
      ];
      return '<div class="summary-group"><div class="summary-subhead">'+escape(name)+'</div><div class="summary-grid">'+rows.map(([label,value])=>'<div class="summary-line"><div class="summary-key">'+escape(label)+'</div><div class="summary-val'+attentionClass(value)+'">'+escape(value)+'</div></div>').join("")+'</div></div>';
    };

    let html=personBlock(state.clientName||"Client",false);
    if(isCouple()) html+=personBlock(state.partnerName||"Partner",true);
    html+='<div class="summary-group"><div class="summary-grid">'+
      '<div class="summary-line"><div class="summary-key">Current coverage meets needs?</div><div class="summary-val'+attentionClass(D("insuranceFit"))+'">'+escape(D("insuranceFit"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">Open to reviewing options?</div><div class="summary-val'+attentionClass(D("insuranceOpen"))+'">'+escape(D("insuranceOpen"))+'</div></div>'+
      '</div></div>';
    return html;
  }

  function renderInvestmentSummary(){
    let html='';
    html+='<div class="summary-group"><div class="summary-subhead">Retirement Timing</div><div class="summary-grid">'+
      '<div class="summary-line"><div class="summary-key">Target retirement age</div><div class="summary-val">'+escape(D("clientRetirementAge"))+'</div></div>'+
      (isCouple()?'<div class="summary-line"><div class="summary-key">'+escape((state.partnerName||"Partner")+" target retirement age")+'</div><div class="summary-val">'+escape(D("partnerRetirementAge"))+'</div></div>':'')+
      '</div></div>';
    html+='<div class="summary-group"><div class="summary-subhead">Current Accounts</div>';
    if(selectedInvestmentAccounts().length){
      html+=selectedInvestmentAccounts().map(account=>{
        const entries=investmentEntries(account);
        return entries.map((d,idx)=>{
          const balance=d.balance!==undefined && d.balance!=="" ? Number(d.balance).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2}) : "Not provided";
          const contribution=d.contribution!==undefined && d.contribution!=="" ? Number(d.contribution).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "Not provided";
          const employer=isWorkplaceAccount(account) && d.employerContribution!==undefined && d.employerContribution!=="" ? Number(d.employerContribution).toLocaleString("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:2})+"/month" : "";
          const fullMatch=isWorkplaceAccount(account) ? (d.fullMatch||"Not provided") : "";
          const label=entries.length>1 ? account+" "+(idx+1) : account;
          return '<div class="account-card"><div class="account-name">'+escape(label)+'</div><div class="account-stats">'+
            '<div class="account-stat"><div class="account-stat-label">'+(isCorporateInvestmentAccount(account)?'Current retained / invested amount':'Current balance')+'</div><div class="account-stat-value">'+escape(balance)+'</div></div>'+
            '<div class="account-stat"><div class="account-stat-label">'+(isCorporateInvestmentAccount(account)?'Monthly amount added / invested':'Monthly contribution')+'</div><div class="account-stat-value">'+escape(contribution)+'</div></div>'+
            (employer?'<div class="account-stat"><div class="account-stat-label">Employer contribution / match</div><div class="account-stat-value">'+escape(employer)+'</div></div>':'')+
            (fullMatch?'<div class="account-stat"><div class="account-stat-label">Receiving full employer match?</div><div class="account-stat-value">'+escape(fullMatch)+'</div></div>':'')+
            '</div></div>';
        }).join("");
      }).join("");
    } else {
      html+='<div class="summary-val'+attentionClass(D("investmentAccounts"))+'">'+escape(D("investmentAccounts"))+'</div>';
    }
    html+='</div>';

    html+='<div class="summary-group"><div class="summary-subhead">Saving / Investing For</div><div class="summary-tags">'+
      (state.investmentGoals.length?state.investmentGoals.map(x=>'<span class="summary-tag">'+escape(x)+'</span>').join(""):'<span class="summary-val attention">Not provided</span>')+
      '</div></div>';

    html+='<div class="summary-group"><div class="summary-subhead">Planning Knowledge</div><div class="summary-grid">'+
      '<div class="summary-line"><div class="summary-key">Retirement savings target</div><div class="summary-val'+attentionClass(D("retirementTargetKnowledge"))+'">'+escape(D("retirementTargetKnowledge"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">Tax optimization strategy</div><div class="summary-val'+attentionClass(D("taxOptimizationKnowledge"))+'">'+escape(D("taxOptimizationKnowledge"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">How long retirement savings may last</div><div class="summary-val'+attentionClass(D("retirementDurationKnowledge"))+'">'+escape(D("retirementDurationKnowledge"))+'</div></div>'+
      '<div class="summary-line"><div class="summary-key">Open to reviewing other options?</div><div class="summary-val'+attentionClass(D("investmentOpen"))+'">'+escape(D("investmentOpen"))+'</div></div>'+
      '</div></div>';
    return html;
  }

  function renderSectionSummary(section){
    let content="";
    if(section==="Personal Insurance") content=renderInsuranceSummary();
    else if(section==="Investments") content=renderInvestmentSummary();
    else content=peopleSummary(section).map(([l,v])=>'<div class="review-row"><div class="review-label">'+escape(l)+'</div><div class="review-value">'+escape(v)+'</div></div>').join("");

    const noteKeys={
      "Investments":"investmentNotes",
      "Personal Insurance":"personalInsuranceNotes",
      "Mortgage & Debt Elimination":"mortgageDebtNotes",
      "General Insurance (Home & Auto)":"generalInsuranceNotes",
      "Legal Services":"legalServicesNotes"
    };
    const noteKey=noteKeys[section];
    if(noteKey && state[noteKey]){
      content+='<div class="review-row"><div class="review-label">Notes / context</div><div class="review-value">'+escape(state[noteKey])+'</div></div>';
    }
    return content;
  }

  function householdSummaryRows(){
    return [
      ["Age",D("clientAge")],
      ["Work status",D("clientOccupationStatus")],
      ...(isCouple()?[[ (state.partnerName||"Partner")+" age",D("partnerAge") ]]:[]),
      ...(isCouple()?[[ (state.partnerName||"Partner")+" work status",D("partnerOccupationStatus") ]]:[]),
      ["Annual gross income",moneyD("clientIncome")],
      ...(isCouple()?[[ (state.partnerName||"Partner")+" annual income",moneyD("partnerIncome") ]]:[]),
      ["Children / dependants",D("hasDependants")],
      ...(state.hasDependants==="Yes"?[["Dependant ages",D("dependantAges")]]:[]),
      ["Monthly amount available",moneyD("monthlyAvailable")],
      ["Emergency savings",moneyD("emergencyFund")],
      ["DTC qualification",D("dtcApproved")],
      ...(state.dtcApproved==="Yes"?[["DTC qualifies for",D("dtcApprovedWho")]]:[])
    ];
  }

  function renderHouseholdSummary(){
    return householdSummaryRows().map(([l,v])=>
      '<div class="review-row"><div class="review-label">'+escape(l)+'</div><div class="review-value">'+escape(v)+'</div></div>'
    ).join("");
  }

  function summaryCard(section,editable=true){
    const content=section==="Household Basics" ? renderHouseholdSummary() : renderSectionSummary(section);
    return '<div class="section-card"><div class="section-head"><div class="section-title">'+escape(section)+'</div>'+
      (editable?'<button type="button" class="edit-section" data-edit-section="'+escape(section)+'">Edit</button>':'')+
      '</div>'+content+'</div>';
  }

  function firstQuestionIndexForSection(section){
    const list=visible();
    const targetSection=section==="Household Basics" ? "Start" : section;
    return list.findIndex(x=>x.y!=="sectionSummary" && x.section===targetSection);
  }

  function wireEditButtons(returnKey){
    document.querySelectorAll("[data-edit-section]").forEach(btn=>{
      btn.onclick=()=>{
        rememberCurrent();
        editReturnKey=returnKey;
        editSection=btn.dataset.editSection;
        review=false;
        const target=firstQuestionIndexForSection(editSection);
        if(target>=0){
          index=target;
          render();
        }
      };
    });
  }

  function renderProgressiveSummary(q){
    const list=visible();
    const questions=list.filter(x=>x.y!=="sectionSummary");
    const completedCount=list.slice(0,index).filter(x=>x.y!=="sectionSummary").length;
    const pct=Math.round(completedCount/Math.max(1,questions.length)*100);
    const throughIndex=reviewSections.indexOf(q.summaryThrough);
    const completed=reviewSections.slice(0,throughIndex+1);
    const finalBeforePriorities=q.summaryThrough==="Legal Services";

    $("progressText").textContent=finalBeforePriorities?"Final Summary":"Review";
    $("progressPercent").textContent=pct+"%";
    $("progressBar").style.width=pct+"%";
    $("backBtn").style.visibility="visible";
    $("emailBtn").style.display="none";
    $("continueBtn").style.display="block";
    $("continueBtn").textContent=finalBeforePriorities?"Continue to Priorities":"Continue";

    $("screen").innerHTML=
      '<div class="eyebrow">'+(finalBeforePriorities?'Final Review':'Review')+'</div>'+
      '<h1>'+(finalBeforePriorities?'Final Financial GPS Summary':'Your Financial GPS so far')+'</h1>'+
      '<p class="sub">'+(finalBeforePriorities
        ?'Review the complete Financial GPS below. Next, you will rank the areas you are open to reviewing so your representative knows what to address first.'
        :'Review what has been captured. You can edit any completed section or continue.')+'</p>'+
      completed.map(section=>summaryCard(section,true)).join("");

    wireEditButtons(q.k);
  }

  function renderReview(){
    review=true;
    $("progressText").textContent="Review";
    $("progressPercent").textContent="100%";
    $("progressBar").style.width="100%";
    $("backBtn").style.visibility="visible";
    $("emailBtn").style.display="block";
    $("emailBtn").textContent="Email";
    $("continueBtn").style.display="block";
    $("continueBtn").textContent="Save PDF";

    const household=isCouple()?`${state.clientName} & ${state.partnerName}`:state.clientName;
    const cards=reviewSections.map(sec=>summaryCard(sec,true)).join("");
    const ranking=state.rankedAreas.length
      ? state.rankedAreas.map((x,i)=>(i+1)+". "+x).join("\n")
      : "Not provided";

    $("screen").innerHTML=`
      <div class="eyebrow">Your Financial GPS</div>
      <h1>${escape(household||"Financial GPS Review")}</h1>
      <p class="sub">Review the completed Financial GPS, then choose how you want to save it.</p>
      <div class="action-box">
        <h3>Save this information before closing</h3>
        <div class="note" style="margin-top:0">Financial GPS does not store or automatically submit this information. Choose <strong>Save PDF</strong> or <strong>Email</strong> below.</div>
      </div>
      <div class="section-card"><div class="section-head"><div class="section-title">Your Priorities</div></div><div class="review-row"><div class="review-label">Areas ranked by importance</div><div class="review-value">${escape(ranking)}</div></div></div>
      ${cards}
    `;

    wireEditButtons("__final__");
  }

  function savePdf(){ window.print(); }

  function emailCardText(card){
    const lines=[];
    const heading=card.querySelector(".section-title");
    if(heading) lines.push(heading.textContent.trim().toUpperCase());

    card.querySelectorAll(".summary-subhead,.account-card,.summary-line,.review-row").forEach(el=>{
      if(el.closest(".account-card") && !el.classList.contains("account-card")) return;

      if(el.classList.contains("summary-subhead")){
        const text=el.textContent.trim();
        if(text) lines.push("",text);
        return;
      }

      if(el.classList.contains("account-card")){
        const name=el.querySelector(".account-name");
        if(name) lines.push("",name.textContent.trim());
        el.querySelectorAll(".account-stat").forEach(stat=>{
          const label=stat.querySelector(".account-stat-label");
          const value=stat.querySelector(".account-stat-value");
          if(label && value) lines.push("  "+label.textContent.trim()+": "+value.textContent.trim());
        });
        return;
      }

      if(el.classList.contains("summary-line")){
        const label=el.querySelector(".summary-key");
        const value=el.querySelector(".summary-val");
        if(label && value) lines.push(label.textContent.trim()+": "+value.textContent.trim());
        return;
      }

      if(el.classList.contains("review-row")){
        const label=el.querySelector(".review-label");
        const value=el.querySelector(".review-value");
        if(label && value){
          const v=value.textContent.trim().replace(/\n+/g,"\n  ");
          lines.push(label.textContent.trim()+": "+v);
        }
      }
    });

    return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  }

  function emailFinancialGps(){
    const household=isCouple()?`${state.clientName} & ${state.partnerName}`:state.clientName;
    const parts=[
      "FINANCIAL GPS",
      household||"Client",
      ""
    ];

    $("screen").querySelectorAll(".section-card").forEach(card=>{
      const text=emailCardText(card);
      if(text) parts.push(text,"");
    });

    parts.push(
      "This Financial GPS was prepared in the website and was not automatically stored or submitted.",
      "Please send or save this information manually through your approved process."
    );

    const body=parts.join("\n").replace(/\n{3,}/g,"\n\n").trim();
    const subject="Financial GPS - "+(household||"Client");
    window.location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  }

  $("continueBtn").onclick=()=>{
    if(review){ savePdf(); return; }
    const q=current();

    if(q.y!=="sectionSummary"){
      if(q.y==="dateOrNotSure"){
        const e=$("entry");
        if(e && e.value) state[q.k]=e.value;
      }
      saveEntry(q);
      if(!validate()) return;
    }

    const list=visible();
    const here=list.indexOf(q);
    const next=here>=0 ? list[here+1] : null;

    if(editReturnKey && next && next.y==="sectionSummary" && next.summaryThrough===editSection){
      const returnKey=editReturnKey;
      editReturnKey="";
      editSection="";
      if(returnKey==="__final__"){
        renderReview();
        return;
      }
      const target=visible().findIndex(x=>x.k===returnKey);
      if(target>=0){
        index=target;
        render();
        return;
      }
    }

    if(here>=0 && here<list.length-1){
      rememberCurrent();
      index=here+1;
      render();
    } else {
      rememberCurrent();
      renderReview();
    }
  };

  $("emailBtn").onclick=()=>{
    if(review) emailFinancialGps();
  };

  $("backBtn").onclick=()=>{
    if(!review){
      const q=current();
      if(q && q.y!=="sectionSummary") saveEntry(q);
    }
    if(returnToHistory()) return;
    if(review){
      review=false;
      index=Math.max(0,visible().length-1);
      render();
      return;
    }
    if(index>0){ index--; render(); }
  };

  $("progressPercent").onclick=()=>{
    if(review) return;
    const q=current();
    if(q && q.y!=="sectionSummary") saveEntry(q);
    rememberCurrent();
    const list=visible();
    const target=list.findIndex(x=>x.y==="sectionSummary" && x.summaryThrough==="Legal Services");
    if(target>=0){
      editReturnKey="";
      editSection="";
      index=target;
      render();
    }
  };

  render();
})();
</script>
</body>
</html>
